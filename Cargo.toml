[workspace]
resolver = "3"
members = [
    "crates/refx-core",
    "crates/refx-asset",
    "crates/refx-render",
    "crates/refx-ui",
    "crates/refx-io",
    "crates/refx-platform",
    "crates/refx-app",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.92"
license      = "MIT OR Apache-2.0"
publish      = false

[workspace.lints.rust]
unsafe_code = "forbid"          # override เป็น "allow" ได้เฉพาะ refx-platform (I-5)
missing_docs = "warn"

[workspace.lints.clippy]
all                = { level = "warn", priority = -1 }
unwrap_used        = "warn"     # เส้นทางที่รับข้อมูลจากผู้ใช้/ไฟล์ ห้ามมีเลย
expect_used        = "warn"
panic              = "warn"
disallowed_methods = "warn"     # ดู clippy.toml
float_cmp          = "warn"
large_stack_arrays = "warn"

[workspace.dependencies]
# --- internal ---
refx-core     = { path = "crates/refx-core" }
refx-asset    = { path = "crates/refx-asset" }
refx-render   = { path = "crates/refx-render" }
refx-ui       = { path = "crates/refx-ui" }
refx-io       = { path = "crates/refx-io" }
refx-platform = { path = "crates/refx-platform" }

# --- GPU / window / UI --------------------------------------------------
# !! ล็อกทั้งชุด อัปพร้อมกันเท่านั้น. wgpu 30 ยังใช้กับ egui-wgpu ไม่ได้
#    ดู docs/09-crate-versions.md ก่อนแตะบรรทัดพวกนี้
# ★★★ `default-features = false` เพื่อ **เลือก backend ต่อ OS** ที่ `refx-render`
#   (ดูเหตุผลและตัวเลขที่นั่น) · รายการ default ของ wgpu 29.0.4 คือ
#   std · parking_lot · dx12 · metal · gles · vulkan · wgsl · webgpu
#   — สามตัวหลังสุดไม่มีวันถูกใช้บนเครื่องที่เราแจก แต่ `gles` ถูกคอมไพล์เข้ามาจริง
#
#   ★ ที่ทำได้เพราะ `egui-wgpu` ประกาศ `default-features = false` อยู่แล้ว
#     (features = std, wgsl เท่านั้น) — ถ้ามันดึง default มา การตัดของเราจะไม่มีผล
#     เลยเพราะ feature ถูก union กันทั้ง workspace
wgpu       = { version = "29.0.4", default-features = false }
winit      = "0.30"
egui       = "0.34.3"
# ★★★ `default-features = false` — **ตัวที่ทำให้การเลือก backend มีผลจริง**
#
#   `default` ของ egui-wgpu มี `"wgpu/default"` กับ `"wgpu/webgl"` อยู่ข้างใน
#   → ตราบใดที่เอา default ของมันมา **backend ทั้งชุดกลับเข้ามาทันที** และการ
#   ตัดที่ `refx-render` ไม่มีผลอะไรเลยสักไบต์ (วัดแล้ว: ลดได้ 1,536 ไบต์)
#
#   สิ่งที่เสียไปเมื่อปิด default ของมันบน Windows/Linux: **ไม่มี** —
#   `fragile-send-sync-non-atomic-wasm` กับ `webgl` เป็นของ wasm ·
#   `macos-window-resize-jitter-fix` คือ `wgpu/metal` ซึ่ง `refx-render`
#   เปิดให้เองอยู่แล้วในสาขา macOS (P6)
#
#   เราใช้จาก crate นี้แค่ `Renderer` · `RendererOptions` · `ScreenDescriptor`
#   ซึ่งไม่มีตัวไหนอยู่หลัง feature
egui-wgpu  = { version = "0.34.3", default-features = false }
# ★ `default-features = false` เพื่อถอด feature `links` ตัวเดียว — ที่เหลือคือ
#   รายการ `default` ของ egui-winit 0.34.3 เป๊ะ ๆ (clipboard · wayland · x11 ·
#   winit/default) เทียบจาก [features] ในไฟล์ของมันเอง ไม่ใช่จากความจำ
#
#   `links` ดึง `webbrowser` เข้ามา ซึ่งเป็นต้นทางของ RUSTSEC-2026-0257 และเป็น
#   โค้ดที่ **RefX ไม่เคยเรียกเลย**: ไม่มี hyperlink สักที่ในโปรเจกต์ และ I-8
#   ห้าม network อยู่แล้ว สิ่งเดียวที่หายไปคือ `open_url_in_browser()` ของ
#   egui-winit ซึ่งกลายเป็น log::warn แทนการเปิดเบราว์เซอร์
#
#   ★ ห้ามเขียนเป็น `features = [...]` โดยไม่มี `default-features = false`
#     — จะได้ `links` กลับมาเงียบ ๆ ทั้งที่ดูเหมือนระบุครบแล้ว
#   ★ `clipboard` ต้องอยู่ ไม่งั้น Ctrl+V (P1-8) พังทั้ง Windows และ Linux
#     ส่วน `wayland`/`x11` ขาดตัวใดตัวหนึ่ง = พังเฉพาะบางเดสก์ท็อปบน Linux
#     (clipboard ของ Wayland มาทาง smithay-clipboard ที่ feature `clipboard` ดึง
#      และ `clipboard.rs` ยังมี `cfg(feature = "wayland")` แยกอีกชั้น)
#
#   ★★ `winit/default` ที่อยู่ในรายการ `default` ของ egui-winit **เขียนตรงนี้ไม่ได้**
#      cargo ห้าม slash ในรายการ feature ของ dependency (ใช้ได้เฉพาะใน [features]
#      ของ crate ตัวเอง) · ไม่ใช่ปัญหาเพราะ **เราเปิด default ของ winit เองอยู่แล้ว**
#      ผ่าน `winit = "0.30"` ข้างบน ซึ่ง refx-platform/refx-ui/refx-app พึ่งอยู่ทั้งสามตัว
#      แล้ว cargo รวม feature ทั้งกราฟให้ — ยืนยันด้วยการ diff feature ที่ resolve
#      ได้จริงทั้ง Windows/Linux แล้วว่า winit ได้ feature ชุดเดิมเป๊ะ ไม่ใช่การเดา
egui-winit = { version = "0.34.3", default-features = false, features = [
    "clipboard",
    "wayland",
    "x11",
] }

# --- image decode: pure Rust เท่านั้น (docs/06-security.md) ---------------
#
# ★ เคยมี `zune-jpeg` อยู่ตรงนี้ "เผื่อทำ JPEG scaled decode" แต่ไม่มีโค้ดไหนเรียกเลย
#   ตรวจ source จริงแล้วพบว่า **ทั้ง 0.4 และ 0.5 ไม่มี API scaled decode** ตั้งแต่แรก
#   (docs/05 §6) โครงเปล่าแบบนี้หลอกให้เข้าใจผิดอยู่หลาย session ว่าความสามารถนี้
#   "มีรออยู่แล้ว" — รูปแบบเดียวกับ fuzz_decode ที่เป็น stub เงียบ ๆ
#   `image` ดึง zune-jpeg มาใช้เป็น decoder ภายในอยู่แล้ว จึงไม่เสียอะไรที่ตัดออก
#
# ★ ไม่มี `memmap2` โดยตั้งใจ — ห้ามใส่กลับมาสำหรับไฟล์ของผู้ใช้
#   (ตัดสิน 27 ก.ค. 2026, docs/06 §3) ไฟล์ที่ map ไว้ถูก Dropbox/OneDrive ตัดกลางคัน
#   = SIGBUS ซึ่งเป็น signal ไม่ใช่ panic → catch_unwind จับไม่ได้ → เกราะ I-7
#   ไร้ผลทั้งชั้น โปรเซสตายทันที
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "gif", "bmp", "tga", "tiff",
] }
fast_image_resize = "5"
kamadak-exif      = "0.6"

# ★★★ P5-4 Export — `image` **ไม่มี API สตรีมสำหรับ PNG** (วัดแล้ว 7 ก.ย. 2026:
#   บัฟเฟอร์เต็มที่ 16384² = ~3.4 GB) · ตัวที่มีคือ `png::Writer::stream_writer`
#   ซึ่งอยู่ในทรีอยู่แล้วในฐานะ dep ของ `image` เอง → ประกาศตรงไม่เพิ่มโค้ดเข้า
#   binary แม้แต่ไบต์เดียว สิ่งที่เปลี่ยนคือ **เราเห็นมัน** (docs/09 — อนุมัติ 7 ก.ย. 2026)
#
#   ★★ ต้องตรึงให้ตรงกับที่ `image` ใช้เสมอ · ประตูบังคับใน docs/08 §4:
#      `cargo tree -d | grep '^png'` ต้องว่าง — สองก๊อปปี้ = binary โต และมี
#      ตัวเข้ารหัสสองตัวที่อาจให้ผลไม่เหมือนกัน (รูปแบบเดียวกับประตูของ wgpu)
png       = "0.18"

# --- data ---------------------------------------------------------------
blake3    = "1"
rusqlite  = { version = "0.32", features = ["bundled"] }
postcard  = { version = "1", features = ["use-std"] }
zstd      = "0.13"
serde     = { version = "1", features = ["derive"] }
crc32fast = "1"
# ★ P5-3: อ่าน settings.toml / keymap.toml — เหตุผลที่เลือกตัวนี้แทน `toml 0.8`
#   อยู่ใน docs/09 (dep เดียวคือ serde ที่มีอยู่แล้ว · `toml 0.8` ลากมาอีกสี่ตัว
#   เพื่อความสามารถที่เราไม่ใช้) · และ **ไม่เขียน parser เอง** เพราะไฟล์ config
#   คือ input ที่ไม่น่าไว้ใจตาม I-4 เหมือนกับที่เราไม่เขียน JPEG decoder เอง
basic-toml = "0.1"

# --- concurrency (ไม่มี tokio - ADR-004) --------------------------------
crossbeam-channel = "0.5"
parking_lot       = "0.12"

# --- utility ------------------------------------------------------------
glam        = { version = "0.29", features = ["bytemuck"] }
bytemuck    = { version = "1", features = ["derive"] }
smallvec    = { version = "1", features = ["union"] }
indexmap    = "2"
# ★ เคยมี `slotmap` ตรงนี้ "เผื่อใช้ทำ arena" แต่ไม่มีโค้ดไหนเรียกเลย (ลบ 2 ส.ค. 2026)
#   P2-1 เขียน arena เองเพราะ slotmap **ไม่มี API ใส่ของกลับที่คีย์เดิม** (คีย์ที่ลบแล้ว
#   ตายถาวร) ซึ่งแปลว่า undo ของ "ลบภาพ" จะได้ ItemId ใหม่ แล้ว z_order/Selection/group
#   ที่ยังถือคีย์เก่าจะห้อยหมด — ทำ I-3 ไม่ได้ตั้งแต่ต้น
#   ปล่อยประกาศค้างไว้คือโครงเปล่าแบบเดียวกับ zune-jpeg ที่หลอกเราหลาย session
#   ว่า "ความสามารถนี้มีรออยู่แล้ว" (ดูคอมเมนต์หมวด image decode ข้างบน)
thiserror   = "2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"
rfd         = "0.15"
arboard     = "3"
notify      = "7"
directories = "5"

# --- dev ----------------------------------------------------------------
criterion = "0.5"
proptest  = "1"

[profile.dev]
opt-level = 1              # dev ที่ opt-level 0 ทำให้ decode/resize ช้าจนใช้งานไม่ได้

[profile.dev.package."*"]
opt-level = 3              # dependency คอมไพล์ครั้งเดียว - เอาแบบเร็วไปเลย

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "unwind"   # !! จำเป็นสำหรับ catch_unwind (I-7) ห้ามเปลี่ยนเป็น abort
strip         = "symbols"
debug         = false

[profile.release-debug]
inherits = "release"
debug    = 1
strip    = "none"
