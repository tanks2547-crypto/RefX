[package]
name         = "xtask"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish  = false
license.workspace = true

[dependencies]
anyhow.workspace   = true
refx-io.workspace  = true
refx-core.workspace = true
refx-asset.workspace = true   # ใช้ image crate ผ่าน re-export สำหรับ gen-testdata
image.workspace     = true
# `dump-refx` คำนวณ crc32 ของ document เองเพื่อเทียบกับที่หัวไฟล์ประกาศ —
# ตัวถอดรหัสปกติปฏิเสธไฟล์ไปตั้งแต่ด่านนั้น จึงบอกไม่ได้ว่าค่าที่ได้จริงคืออะไร
crc32fast.workspace = true
glam.workspace      = true    # เทสต์สร้าง Board ตัวอย่าง (UVec2 / Vec2)
# seed ของ `fuzz_document` ทางที่ 3 คือ **postcard ดิบ** ไม่ใช่ไฟล์ทั้งใบ
# `dto::encode_body` คืนของที่บีบแล้ว จึงต้องคลายกลับด้วยตัวเดียวกับที่มันใช้
# ★ ไม่ใช่ dependency ใหม่ของโปรเจกต์ — `refx-io` ใช้ zstd อยู่แล้ว
zstd.workspace      = true
