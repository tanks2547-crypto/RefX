# ★★★ ประตูของ `docs/08 §3.9` ข้อ 1b — **กิ่งที่ input ไปไม่ถึง**
#
# ทำอะไร: ทำให้ด่านคืนค่าเร็วทุกตัว **ทำงานทุกครั้ง** ทีละตัว แล้วรันเทสต์
# ของ crate นั้น · ด่านที่ไม่มีเทสต์ตัวไหนแดงเลย = กิ่งที่ไม่มีใครเคยตรวจ
#
# ทำไมไม่อยู่ใน CI ทุก push — **วัดจริง 12 ก.ย. 2026 บนเครื่องพัฒนา**:
#
#   | crate         | ด่าน | ตัวรอด | เวลา    |
#   |---------------|-----|--------|---------|
#   | refx-core     | 111 |   5 ✅  |  7.4 น. |
#   | refx-io       |  38 |   0 ✅  | 18.0 น. |
#   | refx-asset    |  35 |   0 ✅  | 15.3 น. |
#   | refx-platform |   7 |   1 ✅  |  0.9 น. |
#
# ★ `refx-asset` กับ `refx-platform` เข้า matrix แล้ว (12 ก.ย. 2026) — ตอนที่
#   ยังแดงอยู่มันถูกกันไว้ข้างนอกโดยตั้งใจ: การขึ้นทะเบียนตัวรอดของจริง
#   เป็นข้อยกเว้น คือการปิดปากประตูในวันแรกที่มันพูด · ปิดรูครบแล้วจึงเติม
#
# ★★★ **`refx-platform` ต้องรันบน Windows ไม่ใช่ ubuntu** — ครึ่งหนึ่งของ crate นี้
#   อยู่หลัง `#[cfg(target_os = "windows")]` · การแทรกโค้ดเข้าไปในฟังก์ชันที่
#   **ไม่ได้ถูกคอมไพล์** ไม่เปลี่ยนพฤติกรรมอะไรเลย → ด่านทุกตัวในนั้นจะ "รอด"
#   ด้วยเหตุผลที่ไม่เกี่ยวกับเทสต์แม้แต่นิดเดียว แล้วเราจะอ่านว่าไม่มีเทสต์เห็น
#   (`docs/08 §3.9` ข้อ 9 — เครื่องมือที่โกหกโดยไม่มีใครรู้) · Windows ถูกคิด ×2
#   แต่ crate นี้เล็กที่สุดในบรรดาทั้งสี่ (55 วินาที) จึงยังถูกที่สุดอยู่ดีแม้คูณสอง
#
# ★★ NC **ไม่ได้อยู่ที่นี่** — มันอยู่ใน `cargo test -p xtask` ซึ่งรันทุก push
#   เหตุผล: NC ต้องพิสูจน์ว่าประตูล้ม *เพราะตัวรอดที่ไม่ได้ขึ้นทะเบียน* ·
#   การยิงใส่ crate จริงพิสูจน์ข้อนั้นไม่ได้ถ้า crate นั้นมีตัวรอดของจริงอยู่แล้ว
#   (เกิดจริง: `refx-platform` มีห้าตัว) — ประตูจะล้มด้วยเหตุผลคนละอย่าง
#   แล้วเราจะอ่านว่า "NC ผ่าน" (`docs/08 §3.9` ข้อ 9)
#
# ★ ubuntu เป็นค่าปริยาย — งานนี้ไม่มีอะไรเกี่ยวกับแพลตฟอร์ม และ Windows ถูกคิด ×2
#   ข้อยกเว้นเดียวคือ `refx-platform` ด้วยเหตุผลข้างบน
name: Mutation (docs/08 §3.9 ข้อ 1b)

on:
  # ★ อังคาร — คนละวันกับ `CI` (จันทร์) และ `Fuzz` (จ/พ/ศ) เพื่อไม่ให้สามงานหนัก
  #   ชนกันในวันเดียวจนอ่านไม่ออกว่าอะไรทำให้โควตาหมด
  schedule: [{ cron: "0 2 * * 2" }]   # อังคาร 02:00 UTC
  workflow_dispatch:

# ★ กันรอบตามตารางกับรอบที่กดเองซ้อนกัน — รอบเก่าที่ไม่มีใครอ่านผลคือเวลาที่หายเปล่า
#   (วัดจริง 14–19 ก.ย. 2026: CI เสีย 237 นาทีที่ถูกคิดไปกับรอบที่ถูกแทนที่)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false # ★ crate หนึ่งแดงต้องไม่ปิดบังผลของอีกตัว
      matrix:
        include:
          - { crate: refx-core, os: ubuntu-latest }
          - { crate: refx-io, os: ubuntu-latest }
          - { crate: refx-asset, os: ubuntu-latest }
          # ★ ดูเหตุผลหัวไฟล์ — บน ubuntu ด่านหลัง cfg(windows) จะ "รอด" ฟรี ๆ
          - { crate: refx-platform, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ${{ matrix.crate }}
        run: cargo run -q -p xtask -- mutation ${{ matrix.crate }}
