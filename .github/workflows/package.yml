# สร้างแพ็กเกจที่แจกได้ — **และพิสูจน์ว่าประตูของมันแดงได้จริงในที่ที่มันจะถูกสร้าง**
#
# ★ ไม่อยู่ใน CI ทุก push โดยตั้งใจ: มันคือ release build เต็ม ๆ บน Windows
#   (ถูกคิด ×2) ซึ่งงบ Actions รับไม่ไหวถ้ารันทุกครั้ง · จุดที่ต้องการมันจริงคือ
#   ตอนจะปล่อยของ กับตอนอยากได้ไฟล์ไปลองด้วยมือ
#
# ★★★ ทำไมต้องมี NC ใน CI ทั้งที่มีเทสต์ของ `xtask` อยู่แล้ว
#
#   เทสต์ของ xtask พิสูจน์ **ตรรกะ** ของประตู (เวอร์ชันไม่ตรง → แดง) แต่ไม่ได้
#   พิสูจน์ว่าบนเครื่อง CI ซึ่ง **ไม่มี zip tool เดียวกับเครื่องพัฒนา**
#   ไฟล์จะถูกประกอบและถูกแตะกลับมาตรวจได้จริง · ประตูที่ทำงานเฉพาะบนเครื่อง
#   คนเขียนคือประตูที่จะเงียบในวันที่มีคนอื่นมาสร้างของ (`docs/08 §3.9` ข้อ 9)
name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# ★★★ ยกเลิกรอบเก่าได้ **ยกเว้นรอบที่มาจากแท็ก**
#
#   รอบของแท็กคือรอบที่สร้างของที่จะแจกจริง · การถูกยกเลิกกลางคันแปลว่าแท็กนั้น
#   ไม่มี artifact แล้วต้องไปกดใหม่เอง ซึ่งคือที่ที่คนลืม · แท็กแต่ละตัวมี ref
#   ไม่ซ้ำกันอยู่แล้วจึงไม่ชนกันเอง — เงื่อนไขนี้กันเฉพาะกรณีที่ dispatch
#   ซ้อนเข้ามาทับ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ★ แพ็กเกจที่แจกรายชื่อใบอนุญาตที่ล้าสมัย = แจกโค้ดของคนอื่นโดยไม่มี
      #   ใบอนุญาตของเขา · จับตรงนี้ก่อนจะสร้างไฟล์ ไม่ใช่หลังปล่อยไปแล้ว
      - name: THIRD-PARTY-LICENSES.md ต้องตรงกับ Cargo.lock
        run: cargo run -q -p xtask -- licenses --check

      # ★★★ เหตุผลเดิมที่เขียนไว้ตรงนี้ **ผิด** และความผิดนั้นหลุดออกไปกับของจริง
      #
      #    เดิมเขียนว่า "NC ทับชื่อเดิม จึงต้องรันก่อน" — จริงกับ `no-license`
      #    เท่านั้น · `stale-binary` เปลี่ยนชื่อไฟล์เป็น `refx-9.9.9-...zip`
      #    จึงไม่ทับใคร แล้ว `upload-artifact` ที่เก็บ `target/package/*.zip`
      #    ก็หอบไปด้วย — artifact ของ run 34771844462 มีซิปสองอันจริง ๆ
      #
      #    ตอนนี้ `xtask` เขียน NC ลง `target/package-nc/` คนละที่กับของจริง
      #    ลำดับของขั้นจึงไม่สำคัญอีกต่อไป และของปลอมหลุดออกไปไม่ได้เลย
      - name: negative control ของประตูแพ็กเกจ
        shell: bash
        run: |
          for nc in no-license stale-binary; do
            if REFX_PKG_NC=$nc cargo run -q -p xtask -- package > /dev/null 2>&1; then
              echo "::error::ประตูแพ็กเกจไม่ล้มกับ NC '$nc' — ประตูเองพัง"
              exit 1
            fi
            echo "::notice::NC '$nc' ทำให้ประตูแดงตามที่ควร"
          done

      - name: สร้างแพ็กเกจจริง + ตรวจจากตัวไฟล์ที่ได้
        run: cargo run -q -p xtask -- package

      - uses: actions/upload-artifact@v4
        with:
          name: refx-windows-x86_64-portable
          path: target/package/*.zip
          if-no-files-found: error

  # ★ MSI แยก job เพราะมันต้องลง WiX เพิ่ม และล้มได้ด้วยเหตุผลคนละเรื่องกับ zip
  #   — zip ที่ใช้ได้ต้องไม่ถูกบล็อกเพราะ WiX ลงไม่สำเร็จ
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-wix }
      - name: ให้แน่ใจว่ามี WiX Toolset
        shell: pwsh
        run: |
          $found = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory -ErrorAction SilentlyContinue
          if (-not $found) {
            choco install wixtoolset --no-progress -y
            $found = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" -Directory
          }
          $bin = Join-Path $found[0].FullName "bin"
          "WIX=$($found[0].FullName)\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Output "WiX: $bin"

      - name: ไอคอนต้องตรงกับ assets/icon/refx.svg
        run: cargo run -q -p xtask -- icon --check

      - name: สร้าง MSI
        run: cargo wix -p refx-app --nocapture --output target/package/

      # ★★★ กับดักที่ zip/deb ไม่มี: **ถอนแล้วต้องไม่ลบงานของผู้ใช้** (I-3)
      #   NC ยิงที่ตัวตรวจนั้นโดยตรง — ถ้าไฟล์ผู้ใช้หายแล้วประตูยังเขียว
      #   แปลว่าประตูนี้ไม่ได้ตรวจอะไรเลย
      - name: negative control ของประตู MSI
        shell: bash
        run: |
          msi=$(ls target/package/*.msi | head -1)
          if REFX_PKG_NC=uninstall-eats-data cargo run -q -p xtask -- verify-msi "$msi" > /dev/null 2>&1; then
            echo "::error::ประตู MSI ไม่ล้มแม้งานผู้ใช้ถูกลบ — ประตูเองพัง"
            exit 1
          fi
          echo "::notice::NC ทำให้ประตู MSI แดงตามที่ควร"

      - name: ตรวจ MSI — ติดตั้งจริง ถอนจริง งานผู้ใช้ต้องอยู่
        shell: bash
        run: cargo run -q -p xtask -- verify-msi "$(ls target/package/*.msi | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: refx-windows-x86_64-msi
          path: target/package/*.msi
          if-no-files-found: error

  # ★ `.deb` สร้างบน Linux เท่านั้น — `cargo deb` ต้องการ `dpkg` ในการประกอบ
  #   และประตูของเราต้องการ `dpkg-deb` ในการแตกกลับมาตรวจ
  linux-deb:
    runs-on: ubuntu-latest
    # ★ 60 เพราะรอบนี้ build สองครั้ง (วินิจฉัย + ของที่จะห่อ) คนละชุด feature
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deb }

      - name: THIRD-PARTY-LICENSES.md ต้องตรงกับ Cargo.lock
        run: cargo run -q -p xtask -- licenses --check

      # ★ `.deb` ใส่ assets/icon/refx-256.png ลง hicolor — ไฟล์นั้นต้องยังตรงกับ .svg
      - name: ไอคอนต้องตรงกับ assets/icon/refx.svg
        run: cargo run -q -p xtask -- icon --check

      # ★★★ ปิดคดี `zbus` 157 error — ตัวการคือ `-C relocation-model=pie`
      #     ใน `.cargo/config.toml` **ไม่ใช่ `cargo deb` และไม่ใช่ feature**
      #
      #   `[target.'cfg(target_os = "linux")']` ไม่ได้แยก host ออกจาก target
      #   เมื่อไม่ได้ส่ง `--target` · proc-macro จึงได้ธงนั้นไปด้วยแล้วโหลดไม่ได้
      #   (probe run 34805070404 / 34805412531 — เปลี่ยนตัวแปรทีละตัว)
      #
      # ★★ สิ่งที่ยังไม่ได้แก้ และสำคัญกว่าเรื่องแพ็กเกจ: job `check (ubuntu-latest)`
      #    **ไม่เคยคอมไพล์ zbus เลยสักรอบ** — `Compiling zbus` = 0 ทุกครั้งที่ตรวจ
      #    มันหยิบจาก cache · Linux build จากศูนย์จึงพังอยู่นานโดยไม่มีใครรู้
      #    และรู้ได้เพราะ job นี้เป็น job แรกที่ cache ว่าง (ดู ROADMAP)
      #
      # ★ `--no-build` ยังอยู่: ห่อของที่ build ผ่านแล้ว ถูกกว่า build ซ้ำ
      - name: สภาพเครื่อง + toolchain ที่จะถูกใช้จริง
        # ★ พิมพ์ `rustc -vV` เสมอ — `rust-toolchain.toml` ตรึงไว้ที่ 1.92
        #   ซึ่ง **ไม่ใช่** ตัวที่ `dtolnay/rust-toolchain@stable` ติดตั้ง
        #   ความต่างนั้นมองไม่เห็นเลยถ้าไม่พิมพ์ และเคยพาการวินิจฉัยหลงทางมาแล้ว
        run: |
          df -h /
          free -m
          nproc
          rustc -vV

      # ★ ของที่จะห่อต้องเป็น **default features เท่านั้น** — `--all-features`
      #   เปิด `force-device-lost` ซึ่งเป็นตะขอทดสอบ ห้ามติดไปกับของที่แจก
      - name: build ที่จะถูกห่อ
        run: cargo build --release --locked -p refx-app

      - name: สร้าง .deb
        run: cargo deb -p refx-app --no-build --output target/package/

      # ★★ NC ก่อนของจริง — ตัว NC ลบไฟล์ออกจาก **สิ่งที่แตกมา** ไม่ใช่จากแพ็กเกจ
      #    ตัวไฟล์ `.deb` จึงไม่ถูกแตะ และของที่อัปโหลดยังเป็นตัวเดียวกับที่ตรวจผ่าน
      - name: negative control ของประตู .deb
        shell: bash
        run: |
          deb=$(ls target/package/*.deb | head -1)
          if REFX_PKG_NC=no-license cargo run -q -p xtask -- verify-deb "$deb" > /dev/null 2>&1; then
            echo "::error::ประตู .deb ไม่ล้มแม้ใบอนุญาตหายไป — ประตูเองพัง"
            exit 1
          fi
          echo "::notice::NC ทำให้ประตู .deb แดงตามที่ควร"

      - name: ตรวจ .deb จากตัวแพ็กเกจ
        shell: bash
        run: cargo run -q -p xtask -- verify-deb "$(ls target/package/*.deb | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: refx-linux-x86_64-deb
          path: target/package/*.deb
          if-no-files-found: error
