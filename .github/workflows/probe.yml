# ★ workflow ชั่วคราว — **มีอายุเท่ากับคำถามเดียว** แล้วต้องถูกลบ
#
# รอบที่ 1 (run 34805070404) ตอบไปแล้วว่า:
#   A  ตามการตั้งค่าปัจจุบัน                 → failure
#   B  เอา `.cargo/config.toml` ออก          → success
#   C  ใช้ stable แทน 1.92                   → failure
#
# → สาเหตุอยู่ใน `.cargo/config.toml` ไม่ใช่ toolchain ไม่ใช่ feature
#   และ **`cargo build --release -p zbus` โดด ๆ ก็เกิดซ้ำได้** (~2 นาที)
#   ซึ่งทำให้คำถามที่เหลือถูกได้ในราคาถูก
#
# รอบที่ 2 — ธงตัวไหน และ `--target` ช่วยไหม
#
#   ★ ต้องรู้ให้ชัดเพราะสองธงนี้เป็น **การเสริมความแข็งแรงของ binary ที่แจก**
#     (PIE + RELRO/BIND_NOW) จะทิ้งทั้งก้อนไม่ได้ ต้องรู้ว่าตัวไหนพังแล้วเก็บอีกตัว
#
#   ★★ RUSTFLAGS ของ env **แทนที่** rustflags ในไฟล์ config ทั้งชุด
#      จึงย้ายไฟล์ออกแล้วตั้ง env เองเพื่อคุมตัวแปรทีละตัวได้จริง
name: Probe (zbus บน Linux)

on: workflow_dispatch

jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # ★ ไม่มี rust-cache โดยตั้งใจ — คำถามนี้เกี่ยวกับ build จากศูนย์
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: rustc -vV

      - name: เอา .cargo/config.toml ออกก่อน แล้วคุม RUSTFLAGS เอง
        run: mv .cargo/config.toml /tmp/refx-cargo-config.toml

      - name: D · มีแต่ -C relocation-model=pie
        id: d
        continue-on-error: true
        env:
          RUSTFLAGS: "-C relocation-model=pie"
        run: cargo build --release -p zbus

      - name: E · มีแต่ -C link-arg=-Wl,-z,relro,-z,now
        id: e
        continue-on-error: true
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,relro,-z,now"
        run: cargo build --release -p zbus

      - name: คืน .cargo/config.toml
        run: mv /tmp/refx-cargo-config.toml .cargo/config.toml

      # F — config ครบเหมือนเดิม แต่ระบุ --target ตรง ๆ
      #     ★ การส่ง `--target` ทำให้ cargo **แยก host ออกจาก target** —
      #       proc-macro และ build script จะไม่ได้รับ rustflags ของ target อีก
      #       ถ้า F เขียว แปลว่าตัวที่พังคือ **proc-macro ที่ถูกใส่ธงของ target**
      - name: F · config เดิมครบ แต่ build ด้วย --target
        id: f
        continue-on-error: true
        run: cargo build --release -p zbus --target x86_64-unknown-linux-gnu

      - name: สรุป
        run: |
          echo "D (เฉพาะ pie)          : ${{ steps.d.outcome }}"
          echo "E (เฉพาะ relro/now)    : ${{ steps.e.outcome }}"
          echo "F (config เดิม+--target): ${{ steps.f.outcome }}"
