name: CI
on:
  push:
  pull_request:
  # ★ CVE ใหม่ถูกประกาศ **หลัง** commit สุดท้ายเสมอ
  #   repo ที่ไม่มีใครแตะสองสัปดาห์ = สองสัปดาห์ที่ไม่มีใครรู้ว่า dependency
  #   มีช่องโหว่ใหม่ (docs/06 §2.5) — job `deny` จึงต้องเดินเองตามเวลาด้วย
  #
  #
  # ★★★ **ตารางนี้คือที่ที่ Windows ถูกตรวจ** (กลับมาเป็นแบบนี้ 24 ก.ย. 2026
  #   หลังวัดว่ามันกิน 65.6 นาทีที่ถูกคิดต่อรอบ) — จันทร์กับพฤหัส ห่างกัน 3–4 วัน
  #   · **และมีประตู `scheduled-status` ที่ทำให้ทุก push แดงถ้ารอบล่าสุดแดง
  #   หรือหายเกิน 6 วัน** ซึ่งเป็นสิ่งที่ไม่มีตอนที่มันแดงเงียบสองสัปดาห์
  schedule: [{ cron: "0 4 * * 1,4" }]   # จันทร์/พฤหัส 04:00 UTC
  workflow_dispatch:

# ★★★ push สองครั้งติดกัน = รอบเก่ารันทิ้งไว้จนจบโดยไม่มีใครอ่านผล
#
#   วัดจากของจริง 14–19 ก.ย. 2026: มี **6 รอบ CI ที่ถูกแทนที่** ระหว่างยังรันอยู่
#   และเวลาที่เหลือของ job ที่ยังไม่จบตอนนั้นรวมเป็น **237 นาทีที่ถูกคิด**
#   — ราว 12 % ของทั้งหมดในช่วงนั้น **โดยไม่มีใครได้อะไรกลับมาเลยสักนาที**
#
#   ★ จัดกลุ่มตาม ref จึงไม่ข้ามสาขากัน · รอบที่ถูกยกเลิกไม่ทำให้ประตูอ่อนลง
#     เพราะรอบใหม่ที่มาแทนตรวจของใหม่กว่าเสมอ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # ★★★ ประตูเดียวที่ตัดสินว่ารอบนี้ต้องรันของหนักไหม และรันบนอะไร
  # ---------------------------------------------------------------------------
  # เพิ่ม 10 ส.ค. 2026 เพราะโควตา Actions ของบัญชีหมดจน CI หยุดรันไปหลายวัน
  # (HANDOFF §1) · สองอย่างที่กินโควตามากที่สุดและได้ผลตอบแทนน้อยที่สุด:
  #
  #   1. commit ที่แก้ **markdown ล้วน** จุด matrix เต็ม — วัดจากของจริง 21 จาก 78
  #      commit ในช่วง 20 วันเป็น `.md` ล้วน · เอกสารเปลี่ยนไม่ทำให้ผลของ
  #      clippy/nextest/ขนาด binary เปลี่ยนได้เลยแม้แต่ทางเดียว
  #   2. runner **Windows ถูกคิดนาที ×2** และช้ากว่าจริงอีก 1.6-2.0 เท่า
  #      = ~3.7 เท่าของ Linux ต่อความครอบคลุมเท่ากัน (วัด 24 ก.ย. 2026)
  #
  # ★ ที่ไม่ทำคือ `paths-ignore` ระดับ workflow — มันทำให้ **ไม่มี status เลย**
  #   สำหรับ commit นั้น ซึ่งอ่านไม่ออกว่า "ไม่ต้องตรวจ" หรือ "ยังไม่ได้ตรวจ"
  #   การข้ามด้วย `if:` ทำให้ job โผล่เป็น **skipped พร้อมเหตุผลใน log**
  #   (docs/08 §3.9 ข้อ 2: โครงเปล่าห้ามเงียบ — ข้ามได้ แต่ต้องข้ามอย่างชัดเจน)
  #
  # ★★★ **Windows เข้า push แล้วออกอีกครั้ง — บันทึกทั้งสองรอบไว้ทั้งคู่**
  #
  #   19 ก.ย. 2026 **เข้า**: ตอนอยู่เฉพาะ schedule + กดเอง มันแดง **สองรอบติด
  #   โดยไม่มีใครรู้** (`what_an_export_really_costs…` timeout บน WARP)
  #   · `docs/08 §3.9` ข้อ 16: สิ่งที่คุมการ merge ต้องรันทุก push
  #
  #   24 ก.ย. 2026 **ออก**: โควตา Actions หมด · วัดแล้วพบว่า **งานตามตาราง
  #   อย่างเดียวกิน 94 % ของโควตารายเดือน** และ `check (windows-latest)`
  #   = 65.6 นาทีที่ถูกคิดต่อรอบ (~3.7 เท่าของ Linux)
  #
  #   ★★★ **สิ่งที่เปลี่ยนไม่ใช่ราคา — คือมี `scheduled-status` แล้ว**
  #   รอบแรกที่ถอด Windows ออกมันเงียบได้เพราะ *ไม่มีอะไรจุดให้เห็น* ·
  #   ตอนนี้ทุก push อ่านผลรอบ Windows ล่าสุด แล้วแดงถ้ามันแดงหรือหายเกิน 6 วัน
  #   → **ประตูคือสิ่งที่ทำให้การถอดออกปลอดภัย ไม่ใช่ความถี่**
  #
  #   ★ ถ้าจะเอากลับเข้า push **ให้วัดใหม่ก่อน** อย่าเอากลับเพราะรู้สึกไม่ปลอดภัย
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.pick.outputs.code }}
      os: ${{ steps.pick.outputs.os }}
    steps:
      # repo ทั้งก้อน 0.5 MB — clone เต็มถูกกว่าการเดาว่า commit ก่อนหน้าอยู่ไหน
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        shell: bash
        run: |
          set -uo pipefail
          event="${{ github.event_name }}"

          # เหตุการณ์ที่ไม่ใช่ push = ตรวจเต็มเสมอ (schedule / PR / กดเอง)
          # ★ ค่าปริยายคือ "ตรวจ" ทุกกรณีที่ยังไม่แน่ใจ — ประตูที่เดาผิดแล้วข้าม
          #   คือประตูที่ปล่อยของเสียผ่าน ส่วนเดาผิดแล้วตรวจเกินแค่เปลืองนาที
          code=true
          before="${{ github.event.before }}"
          if [ "$event" = "push" ] && [ -n "$before" ] \
             && [ "$before" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
            if [ -z "$changed" ]; then
              echo "::notice::push นี้ไม่มีไฟล์เปลี่ยนเลย — ตรวจเต็มไว้ก่อน"
            elif echo "$changed" | grep -qvE '\.md$'; then
              code=true
            else
              code=false
            fi
            echo "ไฟล์ที่เปลี่ยนใน push นี้:"
            echo "$changed" | sed 's/^/  /'
          fi

          # ★★★ Windows ออกจาก push ธรรมดา — **ด้วยตัวเลข ไม่ใช่ความรู้สึก**
          #
          #   วัดเมื่อ 24 ก.ย. 2026: `check (windows-latest)` = **65.6 นาทีที่ถูกคิด
          #   ต่อรอบ** (จริง 32.2 × ตัวคูณ 2) เทียบกับขา Linux 17.8 · ราว 3.7 เท่า
          #   สำหรับความครอบคลุมเท่ากัน · cache **ไม่ใช่ปัญหา** (ตรวจแล้ว
          #   `full match: true` · crate ของคนอื่นคอมไพล์ 0 ตัว) — Windows
          #   ช้ากว่าจริง 1.6–2.0× แล้วโดนคูณสองตอนคิดเงิน
          #
          #   ★★ แลกมาด้วยอะไร: Windows ยังรัน **จันทร์กับพฤหัส · บนแท็กทุกครั้ง
          #   · และตอนกด Run workflow** → ช่องว่างสูงสุด 3–4 วัน ไม่ใช่ 7
          #   และ job `scheduled-status` ทำให้ **ทุก push แดง** ถ้ารอบ Windows
          #   ล่าสุดแดงหรือหายไปเกิน 6 วัน (`docs/08 §3.9` ข้อ 12)
          #
          #   ★★★ ห้ามเอา Windows กลับเข้า push โดยไม่วัดใหม่ — มันเคยแดงเงียบ
          #   มาสองสัปดาห์ตอนที่ไม่มีประตู · ประตูคือสิ่งที่ทำให้การถอดมันออก
          #   ปลอดภัย ไม่ใช่ความถี่
          if [ "$event" = "push" ] && [ "${GITHUB_REF#refs/tags/}" = "$GITHUB_REF" ]; then
            os='["ubuntu-latest"]'
          else
            os='["ubuntu-latest","windows-latest"]'
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "os=$os"     >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "::notice::ตรวจเต็ม — matrix = $os"
          else
            echo "::notice::ข้ามการตรวจ: push นี้แตะแต่ไฟล์ .md (โค้ดไม่เปลี่ยน ผลตรวจก็เปลี่ยนไม่ได้)"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # ★ มาจาก `changes` เพื่อให้ **ขั้นตอนข้างล่างมีชุดเดียว** ไม่ต้องก๊อป job
        #   ไปทำ `check-windows` แยก ซึ่งจะ drift จากกันวันแรกที่มีใครแก้ข้างเดียว
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # ★★★ ก่อนอะไรทั้งนั้น — job นี้เคยแดงกลางการคอมไพล์ด้วย
      #   "No space left on device" (run 35308516735) และ **รอบเขียวก่อนหน้า
      #   จบด้วยที่ว่าง 96 MB** · มันไม่เคยผ่านเพราะสุขภาพดี มันผ่านมาเฉียด ๆ
      #   โดยที่ตัวเลขนั้นอยู่ใน log ในฐานะ warning ที่ไม่มีใครถูกบังคับให้อ่าน
      - name: คืนที่ว่างบนดิสก์ของ runner
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-disk.sh free
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        # mesa-vulkan-drivers = lavapipe (Vulkan บน CPU) — ทำให้เทสต์ที่แตะ texture
        # จริงมีโอกาสได้รันบน Linux ด้วย ไม่ใช่ข้ามทั้ง matrix (docs/08 §3.9 ข้อ 7)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # ★ ต้องมี --all-features ให้ตรงกับเกณฑ์ใน CLAUDE.md เป๊ะ
      #
      #   เดิมเป็น `cargo test --all` ซึ่ง `--all` = "ทุก package" **ไม่ใช่ทุก feature**
      #   โค้ดหลัง feature gate (`force-device-lost` = เส้นทางกู้ device ทั้งหมด)
      #   จึงไม่เคยถูก build ใน `cargo test` เลย — "CI เขียว" แปลว่าน้อยกว่าที่ทุกคน
      #   เข้าใจ โดยไม่มีใครรู้ตัว รูปแบบเดียวกับ fuzz stub (docs/06 §2.5, docs/08 §3.9)
      - uses: taiki-e/install-action@nextest

      # ★ หลักฐานใน log ว่า job นี้ตรวจ GPU จริงหรือข้าม พร้อมชื่อ adapter
      #   (เทสต์กลุ่ม GPU ปิดเสียง stdout ตอนผ่าน จึงต้องเรียกตัวนี้แยกด้วย --no-capture)
      - name: job นี้ตรวจ GPU ด้วย adapter ตัวไหน
        shell: bash
        run: cargo nextest run -p refx-render --all-features --no-capture -E 'test(gpu_tests_run_where_they_are_required)'

      # ★★★ job นี้ได้ตรวจ clipboard จริงหรือข้าม — ต้องอ่านออกจาก log ทุกครั้ง
      #
      #   เทสต์ clipboard เคยรับ `Err` **ทุกชนิด** ว่าผ่าน ผลคือบน runner headless
      #   มันเขียวโดยไม่ได้แตะ clipboard เลย แล้วบรรทัด "N/N ผ่าน" ก็อ่านได้ว่า
      #   clipboard ถูกตรวจแล้ว ทั้งที่ไม่เคยมีใครตรวจ (docs/08 §3.9 ข้อ 2)
      #
      #   ตอนนี้มันข้ามพร้อมพิมพ์เหตุผล — แต่ข้อความนั้นอยู่ใน stdout ซึ่ง nextest
      #   กลืนไปตอนเทสต์ผ่าน จึงต้องเรียกแยกด้วย --no-capture เหมือนขั้นของ GPU
      #
      #   ★★★ **ตั้ง `REFX_REQUIRE_CLIPBOARD=1` เฉพาะ Windows — จากหลักฐาน ไม่ใช่การเดา**
      #
      #   รอบก่อนจงใจยังไม่ตั้ง เพราะยังไม่รู้ว่า runner ตัวไหนมี clipboard จริง
      #   · run `31773078803` (workflow_dispatch, matrix เต็ม) ตอบแล้ว:
      #
      #     windows-latest : "ตรวจแล้ว: เขียน clipboard ของระบบสำเร็จจริง"
      #     ubuntu-latest  : "ข้าม: ... X11 server connection timed out"
      #
      #   → Windows เป็น job เดียวที่ตรวจกลุ่มนี้ได้จริง จึงเป็นที่ของการบังคับ
      #     ตาม `docs/08 §3.9` ข้อ 12 (ต้องมีอย่างน้อยหนึ่ง job ที่รันจริง ไม่งั้น
      #     ทั้ง matrix ข้ามพร้อมกันแล้วเขียวโดยไม่มีความครอบคลุม)
      #
      #   ✅ **ตั้งแต่ 19 ก.ย. 2026 Windows รันทุก push** การบังคับข้อนี้จึงมีผล
      #      ทุกรอบจริง ๆ ไม่ต้องกด Run workflow เองอีกแล้ว — ซึ่งเป็นสิ่งที่
      #      คอมเมนต์นี้เคยต้องเตือนไว้เพราะมันไม่เป็นจริง
      - name: job นี้ได้ตรวจ clipboard จริงไหม
        shell: bash
        env:
          REFX_REQUIRE_CLIPBOARD: ${{ runner.os == 'Windows' && '1' || '' }}
        run: cargo nextest run -p refx-platform --all-features --no-capture -E 'test(the_real_clipboard)'

      # ★★★ docs/08 §3.9 ข้อ 11 — ต้องมีอย่างน้อยหนึ่ง job ที่ **บังคับ** ว่าต้องมี GPU จริง
      #
      #   เดิมตัวบังคับคือ Windows (WARP) ส่วน Linux "ได้ lavapipe ก็รัน ไม่ได้ก็ข้าม"
      #   พอ Windows ย้ายไปรอบสัปดาห์ละครั้ง **ทุก push จะไม่มีใครบังคับ GPU เลย**
      #   ซึ่งคือสภาพที่ข้อ 11 ห้ามไว้ตรง ๆ (ทั้ง matrix ข้ามพร้อมกัน = ไม่มีใครตรวจ)
      #
      #   → เลื่อน Linux ขึ้นมาเป็นตัวบังคับตามที่คอมเมนต์เดิมเปิดทางไว้
      #     ("ถ้ามันนิ่งพอค่อยเลื่อนขึ้นมาบังคับด้วยทีหลัง") · lavapipe เป็น
      #     dependency ที่เราลงเองด้วย apt จึงเป็นของที่เราคุมได้ ไม่ใช่ของที่
      #     runner บังเอิญมี — apt พังเมื่อไหร่ต้องแดงเสียงดัง ไม่ใช่เขียวเงียบ ๆ
      # ★★★ ขา Windows ตัด `export_memory` ออกหนึ่งตัว — **พร้อมบอกใน log ทุกครั้ง**
      #
      #   เทสต์นั้นเรนเดอร์ tile บน GPU แล้วอ่านกลับ เวลาของมันจึงเป็นเวลาของ
      #   rasterizer ไม่ใช่ของโค้ดเรา · adapter ของแต่ละที่ต่างกันคนละโลก:
      #
      #     เครื่องพัฒนา   RTX 4060 (GPU จริง)                       19 วิ
      #     ubuntu runner llvmpipe 256-bit                        109 วิ
      #     windows runner **WARP** `Microsoft Basic Render Driver` > 600 วิ
      #
      #   ★ **ไม่ได้ตัดออกจาก Windows** — เครื่องพัฒนาทุกเครื่องเป็น Windows และ
      #     รันมันทุกครั้งใน 19 วินาที · ที่ตัดคือ **runner ที่ไม่มี GPU จริง**
      #   ★★ ตัวบังคับใน CI คือ ubuntu ซึ่งรันมันครบทุกขั้น (`§3.9` ข้อ 12 —
      #     ต้องมีอย่างน้อยหนึ่ง job ที่รันจริง ไม่ใช่ข้ามพร้อมกันทั้ง matrix)
      #   ★★★ จำนวนเทสต์ของสอง OS จึงต่างกันหนึ่งตัวโดยตั้งใจ — ถ้าเห็นเลขไม่ตรง
      #     **นี่คือเหตุผล** ไม่ใช่เทสต์หาย
      - name: เทสต์ทั้งชุด — **บังคับว่าต้องมี GPU จริง** ทั้งสองแพลตฟอร์ม
        shell: bash
        env:
          REFX_REQUIRE_GPU: "1"
        run: |
          slow='what_an_export_really_costs_in_process_memory'
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "::notice title=เทสต์ที่ถูกตัดออกจากขา Windows::$slow — มันวัดผ่าน rasterizer และ runner นี้ใช้ WARP (> 600 วิ) · ubuntu รันครบ · เครื่องพัฒนารันครบ"
            cargo nextest run --workspace --all-features -E "not test($slow)"
          else
            cargo nextest run --workspace --all-features
          fi

      # ★★★ ประตูใบอนุญาต — **เงื่อนไขทางกฎหมายของการแจกจ่าย ไม่ใช่ของแถม**
      #
      #   `THIRD-PARTY-LICENSES.md` ถูกสร้างจาก `Cargo.lock` · dependency ขยับ
      #   แล้วไฟล์ไม่ขยับ = เราแจกโค้ดของคนอื่นโดยไม่มีใบอนุญาตของเขาในแพ็กเกจ
      #   ซึ่งเป็นความเสียหายที่ไม่โผล่ตอนคอมไพล์ และโผล่ตอนมีคนมาถามแทน
      #
      #   ★ ลินุกซ์อย่างเดียวพอ — ผลลัพธ์ไม่ขึ้นกับ OS ที่รัน เพราะตัวเครื่องมือ
      #     คำนวณ **ยูเนียนของทั้ง Windows และ Linux** เองอยู่แล้ว · รันสองรอบ
      #     คือจ่าย Windows ×2 เพื่อผลลัพธ์ตัวเดียวกันเป๊ะ
      - name: THIRD-PARTY-LICENSES.md ต้องตรงกับ Cargo.lock
        if: runner.os == 'Linux'
        run: cargo run -q -p xtask -- licenses --check

      # ★★★ ไอคอนที่ commit ไว้ (.ico/.png/.rgba) ต้องยังตรงกับ assets/icon/refx.svg
      #
      #   ไฟล์สามอันนั้นเป็นไบนารีที่ `git diff` อ่านไม่ออก · ใครแก้ .svg แล้วลืม
      #   รัน `cargo xtask icon` จะได้ไอคอนบน taskbar คนละอันกับใน installer
      #   โดยไม่มีอะไรบอก — รูปเดียวกับใบอนุญาตที่ล้าสมัยเงียบ ๆ ข้างบน
      - name: ไอคอนต้องตรงกับ assets/icon/refx.svg
        if: runner.os == 'Linux'
        run: cargo run -q -p xtask -- icon --check

      # negative control (docs/08 §3.9 ข้อ 1) — ทำให้ไฟล์เพี้ยนหนึ่งไบต์
      # แล้วประตูต้องแดง · แก้บนสำเนาที่ CI แล้วคืนค่าด้วย git ทันที
      - name: negative control ของประตูไอคอน
        if: runner.os == 'Linux'
        shell: bash
        run: |
          printf '\0' >> assets/icon/refx-64.rgba
          if cargo run -q -p xtask -- icon --check > /dev/null 2>&1; then
            git checkout -- assets/icon/refx-64.rgba
            echo "::error::ประตูไอคอนไม่ล้มแม้ไฟล์เพี้ยน — ประตูเองพัง"
            exit 1
          fi
          git checkout -- assets/icon/refx-64.rgba
          echo "::notice::negative control ผ่าน — ประตูไอคอนล้มได้จริง"

      - run: cargo build --release --all-features

      # ★ เพดาน binary ต้องบังคับอัตโนมัติ ไม่ใช่ความหวัง (docs/08 §6)
      #   งบที่ไม่มีใครตรวจคืองบที่จะถูกละเมิดเงียบ ๆ — เอกสารเคยเขียน 12 MB
      #   ขณะที่ของจริง 15.35 MB ต่างกัน 3.3 MB โดยไม่มีใครรู้ จนมีคนไปวัดด้วยมือ
      #   สคริปต์พิมพ์ขนาดทุกครั้งไม่ว่าผ่านหรือไม่ เพื่อให้ย้อนดูแนวโน้มใน log ได้
      - name: ขนาด binary ต้องไม่เกินเพดาน
        shell: bash
        run: scripts/check-binary-size.sh

      # negative control (docs/08 §3.9 ข้อ 1) — พิสูจน์ทุกครั้งว่าตัวตรวจ "ล้มเป็น"
      # ถ้าขั้นนี้ผ่าน แปลว่าเพดานข้างบนเป็นสัญญาณเขียวปลอมอีกอันหนึ่ง
      - name: negative control ของตัวตรวจขนาด
        shell: bash
        run: |
          if REFX_MAX_BINARY_BYTES=1 scripts/check-binary-size.sh > /dev/null 2>&1; then
            echo "::error::ตัวตรวจขนาด binary ไม่ล้มแม้ตั้งเพดานเป็น 1 ไบต์ — ตัวตรวจเองพัง"
            exit 1
          fi
          echo "::notice::negative control ผ่าน — ตัวตรวจขนาด binary ล้มได้จริง"

      # ★ เพดาน benchmark (docs/08 §2) — P5-1
      #
      #   ★★ ครอบเฉพาะแถวที่วัดได้โดย **ไม่ต้องมี GPU และไม่ต้องมี dataset หลาย GB**
      #   แถวที่เหลือ (frame_pan / startup / rss / vram / open_board) ต้องรันแอปจริง
      #   พร้อมภาพ 1000 ใบ ซึ่งเอาเข้าทุก push ไม่ได้ด้วยงบ Actions — ดูรายงาน P5-1
      #
      #   ★ ตัวเลขบน runner ที่แชร์กับคนอื่นแกว่งกว่าในเครื่องมาก แต่เพดานของสองแถวนี้
      #   ห่างจากค่าจริง **~150 เท่า** จึงไม่ใช่เทสต์ที่ assert เวลานาฬิกาแบบที่
      #   `docs/08 §3.9` ข้อ 5b ห้ามไว้ — มันจับได้เฉพาะหายนะ ไม่ใช่ความแกว่ง
      #   ★★★ **ขา Linux เท่านั้น** (24 ก.ย. 2026) — `docs/08 §3.9` ข้อ 7 บอกเอง
      #   ว่าการ *เทียบ* ประสิทธิภาพต้องทำบนเครื่องเดียวกันในเซสชันเดียว ·
      #   bench บน CI จึงไม่ใช่การเทียบ มันคือ **เพดานสัมบูรณ์** ซึ่งตรวจที่
      #   ขาเดียวก็พอ · วัดแล้วขา Windows ใช้ 4.5 นาที = **9 นาทีที่ถูกคิด
      #   ต่อรอบ** สำหรับคำถามที่ขา Linux ตอบไปแล้ว (2.2 นาที)
      #
      #   ★★ ถ้าวันหนึ่งมีเพดานที่ **ต่างกันตามแพลตฟอร์มจริง ๆ** ข้อนี้ต้องกลับมา
      #   — ตอนนี้สองแถวที่วัดคือ layout กับ decode ซึ่งไม่แตะ API ของ OS เลย
      - name: benchmark ต้องไม่เกินเพดาน
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/check-bench.sh

      - name: negative control ของตัวตรวจ benchmark
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if REFX_BENCH_LIMIT_NS=1 scripts/check-bench.sh > /dev/null 2>&1; then
            echo "::error::ตัวตรวจ benchmark ไม่ล้มแม้ตั้งเพดานเป็น 1 ns — ตัวตรวจเองพัง"
            exit 1
          fi
          echo "::notice::negative control ผ่าน — ตัวตรวจ benchmark ล้มได้จริง"

      # ★★ `always()` โดยตั้งใจ — ถ้า job แดงเพราะดิสก์เต็ม ขั้นนี้คือขั้นที่
      #   **บอกว่าเป็นเพราะดิสก์** แทนที่จะปล่อยให้อ่าน error ของ rustc แล้วเดา
      - name: เหลือที่ว่างเท่าไหร่ — ต้องอ่านทุกรอบ ไม่ใช่ตอนที่มันเป็นศูนย์แล้ว
        if: always() && runner.os == 'Linux'
        shell: bash
        run: scripts/check-disk.sh report

      - name: negative control ของตัวตรวจดิสก์
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if REFX_DISK_FLOOR_MB=99999999 scripts/check-disk.sh report > /dev/null 2>&1; then
            echo "::error::ตัวตรวจดิสก์ไม่ล้มแม้ตั้งพื้นสูงเกินจริง — ตัวตรวจเองพัง"
            exit 1
          fi
          echo "::notice::negative control ผ่าน — ตัวตรวจดิสก์ล้มได้จริง"

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # advisory database ขยับเองได้โดยที่ repo ไม่ขยับ — ตารางรายสัปดาห์ข้างบน
  # จึงยังจุด `deny` อยู่เสมอ (รอบ schedule ทำให้ `changes` คืน code=true)

  # I-8: พิสูจน์ว่า binary ไม่มี network stack อยู่จริง
  no-network:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ห้ามมี network/async dependency ใน tree
        run: |
          if cargo tree --all-features 2>/dev/null | grep -iE '\b(reqwest|hyper|tokio|curl|ureq|openssl|native-tls)\b'; then
            echo "::error::พบ network/async dependency — ละเมิด I-8 (ARCHITECTURE.md)"
            exit 1
          fi

  # ห้ามมี wgpu / png สองเวอร์ชัน (docs/09-crate-versions.md)
  #
  # ★ อยู่ใน job เดียวกันโดยตั้งใจ — ทั้งสองข้อถามคำถามเดียวกัน ("ทรีมีของซ้ำไหม")
  #   บน runner ตัวเดียวกัน · แยก job = จ่ายค่า checkout+toolchain สองรอบเปล่า ๆ
  single-wgpu:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: ห้ามมี wgpu สองเวอร์ชัน
        run: |
          dup=$(cargo tree -d 2>/dev/null | grep -c '^wgpu' || true)
          if [ "$dup" -gt 0 ]; then
            echo "::error::มี wgpu หลายเวอร์ชัน — ดู docs/09-crate-versions.md"
            cargo tree -d | grep -A3 '^wgpu'
            exit 1
          fi
      # ★★ P5-4: เราตรึง `png` ตรง ๆ เพื่อเขียน PNG ทีละแถบ · ถ้าเวอร์ชันของเรา
      #    เลื่อนออกจากที่ `image` ใช้ จะได้ **ตัวเข้ารหัสสองตัวที่อาจให้ผลไม่เหมือนกัน**
      #    และ binary โตขึ้นฟรี ๆ — `^` สำคัญ ไม่งั้นจับ crate ลูกที่ลงท้ายด้วย png
      - name: ห้ามมี png สองเวอร์ชัน
        run: |
          dup=$(cargo tree -d 2>/dev/null | grep -c '^png' || true)
          if [ "$dup" -gt 0 ]; then
            echo "::error::มี png หลายเวอร์ชัน — ดู docs/09-crate-versions.md"
            cargo tree -d | grep -A3 '^png'
            exit 1
          fi

  # ★★★ ประตูของบานที่สอง — **รอบตามตารางที่แดงต้องหยุด merge ได้**
  #
  # `docs/08 §3.9` ข้อ 16: job ที่รันคนละทริกเกอร์กับที่คนดู = job ที่ไม่มีใครดู
  # · `cold-build` รันสัปดาห์ละครั้งโดยธรรมชาติ (มันคือ build จากศูนย์ × 2 OS
  # จะเอาเข้าทุก push ไม่ได้จริง ๆ) → บานนี้จึงปิดด้วยการ **ลากผลของมันมาไว้บน push**
  #
  # ★ นี่คือรูปแบบที่ควรใช้กับ job รายสัปดาห์ **ทุกตัวในอนาคต** ไม่ใช่เฉพาะตัวนี้
  #   — `mutation` และ `fuzz` ยังไม่มีประตูแบบนี้ (ดู ROADMAP v1.1)
  # ★★★ ประตูของงานตามตารางทุกตัว — **ตัวเดียว รับชื่อ workflow + เพดานอายุ**
  #
  #   งานตามตารางถูกลดความถี่ลงเมื่อ 24 ก.ย. 2026 เพื่อลดต้นทุน CI
  #   (วัดแล้ว: งานตามตารางอย่างเดียวกินไป 94 % ของโควตารายเดือน)
  #   · การลดความถี่ **ต้องแลกมาด้วยประตู** ไม่งั้นมันคือการลดความครอบคลุมเฉย ๆ
  #
  #   เพดานอายุของแต่ละตัว = คาบของมัน **บวกระยะเผื่อประมาณครึ่งคาบ**
  #   เพื่อให้รอบที่ช้าไปหนึ่งวันไม่ทำให้ทุก push แดง แต่รอบที่ **หายไปทั้งรอบ**
  #   ถูกจับได้เสมอ
  # ★★ **job เดียว วนสี่รอบ — ไม่ใช่ matrix สี่ job**
  #
  #   GitHub คิดเงิน **ปัดขึ้นเป็นนาทีเต็มต่อ job** · matrix สี่ขาที่แต่ละขา
  #   ทำงานจริงไม่ถึงสิบวินาทีจึงถูกคิด **4 นาทีต่อ push** แทนที่จะเป็น 1
  #   — ที่ ~160 push/เดือนคือ ~480 นาทีที่หายไปกับค่าตั้งต้นของ runner ล้วน ๆ
  #
  #   ★ แลกกับอะไร: ถ้าตัวแรกแดง ตัวหลังไม่ได้รัน · จึงเก็บผลทั้งสี่ก่อนแล้ว
  #     ค่อยสรุป — **ทุกตัวถูกรายงานเสมอ** ไม่ใช่หยุดที่ตัวแรกที่พัง
  scheduled-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: งานตามตารางทุกตัวยังเขียวและยังไม่เก่าเกินไปไหม
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          bad=0
          # เพดานอายุ = คาบของมัน **บวกเผื่อราวครึ่งคาบ** เพื่อให้รอบที่ช้าไป
          # หนึ่งวันไม่ทำให้ทุก push แดง แต่รอบที่ **หายทั้งรอบ** ถูกจับได้เสมอ
          #
          # ★ ขา Windows อยู่ใน ci.yml เอง ไม่ใช่ workflow แยก — จึงถามถึง **job**
          #   (อาร์กิวเมนต์ที่สี่) ดูเหตุผลใน scripts/last-run-status.sh
          while IFS='|' read -r wf days label job; do
            [ -n "$wf" ] || continue
            scripts/last-run-status.sh "$wf" "$days" "$label" "$job" || bad=1
            echo "---"
          done <<'LIST'
          cold-build.yml|17|cold-build|
          fuzz.yml|10|fuzz|
          mutation.yml|38|mutation|
          ci.yml|6|Windows|check (windows-latest)
          LIST
          if [ "$bad" -ne 0 ]; then
            echo "::error title=งานตามตารางมีตัวที่แดงหรือเก่าเกินไป::อ่านรายการข้างบน — ทุกตัวถูกตรวจแล้ว ไม่ได้หยุดที่ตัวแรก"
            exit 1
          fi
