# ★ "nightly" ในชื่อหมายถึง **toolchain** ไม่ใช่ตารางเวลา
#
# ประวัติความถี่ — ทุกคืน → จ/พ/ศ (`192f876`, 10 ส.ค. 2026 · โควตาหมดจน CI หยุดไปหลายวัน)
# → สัปดาห์ละครั้ง (`dbf2ed2`, 20 ก.ย. 2026 · ตอนวัดต้นทุน CI)
#
# ★★★ 21 ก.ย. 2026: `dbf2ed2` เปลี่ยน cron เป็นจันทร์อย่างเดียวแต่ไม่แก้คอมเมนต์
#     ที่เขียนว่า "จ/พ/ศ" — รูปเดียวกับคอมเมนต์ `idle_produces_no_redraw (5 วินาที)`
#     ที่ผิดไป 120 เท่า · คราวนี้อยู่ได้วันเดียวเพราะ `xtask/tests/cron_comments.rs`
#     จับได้ในคอมมิตถัดมา — **ไม่ใช่เพราะมีคนอ่านเจอ**
#
# ★ วันที่ในสองบรรทัดบนผูกกับคอมมิตไว้ตรง ๆ ตาม `docs/08 §3.9` ข้อ 5c ·
#   ตัวเลข "กี่วัน" ที่ไม่ผูกกับคอมมิตเป็นตัวเลขที่แต่งได้โดยไม่มีใครตรวจ
#
# ★★★ ทำไม "สัปดาห์ละครั้ง" — ตัดสินจากตัวเลข ไม่ใช่จากราคา (25 ก.ย. 2026)
#
#   วัดสามรอบ: A `35561900295` (ไม่มี seed ไม่มี cache) · B `36027423718` (seed
#   ไม่มี cache) · C `36029852097` (seed + corpus ที่คืนจาก B) · `cov` ต้นรอบ → ท้ายรอบ
#
#   | target          | A          | B            | C             |
#   |-----------------|------------|--------------|---------------|
#   | `fuzz_packed`   | 184 → 331  | 184 → 331    | 331 → **331** |
#   | `fuzz_layout`   | 34 → 743   | 484 → 746    | 484 → 746 (*) |
#   | `fuzz_document` | 254 → 1255 | 721 → 1290   | 1290 → 1300   |
#   | `fuzz_decode`   | 1953 → 5590| 1953 → 5205  | 5196 → 5332   |
#
#   (*) C ลบ cache ของ layout ทิ้งเพื่อทำ NC ของ cache — จึงเริ่มจาก seed
#
#   → สามตัวแรก **อิ่มภายในรอบเดียว** — รอบที่สองได้ 0 / 0 / +10 · ถี่ขึ้นไม่ช่วย
#   → `fuzz_decode` ยังไม่อิ่ม แต่ตัวจำกัดคือ **ความเร็วของ runner** ไม่ใช่จำนวนรอบ:
#     exec/s ต่างกัน 2.6 เท่าระหว่างรอบ (5196 / 2682 / 1994) และรอบ A ที่ไม่มี cache
#     แต่ได้ runner เร็ว ไปได้ **5590** สูงกว่ารอบ C ที่มี cache (5332)
#
#   ★ ข้อจำกัดของข้อมูล: หนึ่งรอบต่อเงื่อนไข · ความเร็ว runner ไม่คงที่ ·
#     `cov` บอกว่าแตะโค้ดใหม่ ไม่ได้บอกว่าแตะ **โค้ดของเรา** หรือของ decoder ภายนอก
name: Fuzz (nightly toolchain)
on:
  schedule: [{ cron: "0 3 * * 1" }]   # จันทร์ 03:00 UTC
  workflow_dispatch:

# ★ ทำไมต้องตั้ง RUSTUP_TOOLCHAIN (แก้ 2 ส.ค. 2026)
#
# `rust-toolchain.toml` ที่รากตรึง channel = "1.92" ไว้ และ **ไฟล์นั้นชนะ**
# `rustup default nightly` ที่ dtolnay/rust-toolchain ตั้งให้ ผลคือทุก job ในไฟล์นี้
# รันด้วย stable 1.92 ทั้งที่ workflow ชื่อ "Fuzz (nightly)" และลง nightly ไปแล้ว
#
# `cargo fuzz` ต้องใช้ `-Zsanitizer` จึงล้มเสียงดัง (ดีแล้ว) แต่ `fuzz-lint`
# **ผ่านแบบเงียบ ๆ บน stable** ทั้งที่หน้าที่ของมันคือตรวจว่าโค้ดคอมไพล์บน nightly ได้
# — เขียวโดยไม่ได้ตรวจสิ่งที่ตั้งใจจะตรวจ ซึ่งคือกับดักเดียวกับ docs/08 §3.9
#
# `RUSTUP_TOOLCHAIN` ชนะ toolchain file ตามลำดับความสำคัญของ rustup
# **ไม่ใช่การปักหมุดวันที่** — ยังเป็น nightly ล่าสุดเสมอ ถ้า nightly พังเราต้องรู้
# ★ กันรอบตามตารางกับรอบที่กดเองซ้อนกัน — รอบเก่าที่ไม่มีใครอ่านผลคือเวลาที่หายเปล่า
#   (วัดจริง 14–19 ก.ย. 2026: CI เสีย 237 นาทีที่ถูกคิดไปกับรอบที่ถูกแทนที่)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  # ★ ยิงเฉพาะ target ที่ **ต่อกับโค้ดจริงแล้ว**
  #
  # เดิม matrix มีครบสี่ตัวและผ่านทุกคืน ทั้งที่ทั้งสี่เป็น `let _ = data;`
  # → เขียวโดยไม่ได้ตรวจอะไรเลย ซึ่งแย่กว่าไม่มี job นี้ตั้งแต่แรก (docs/06 §2.5)
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_decode, fuzz_layout, fuzz_document, fuzz_packed]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      # ★ negative control ของตัวเอง: ถ้า toolchain หลุดกลับไป stable อีกครั้ง
      #   job นี้ต้องแดงทันที ไม่ใช่ผ่านแบบเงียบ ๆ แล้วบอกว่า "ตรวจ nightly แล้ว"
      - name: ยืนยันว่าใช้ nightly จริง
        run: |
          rustc --version
          if ! rustc --version | grep -q nightly; then
            echo "::error::job นี้ไม่ได้รันบน nightly — rust-toolchain.toml ชนะอีกแล้ว"
            exit 1
          fi
      - run: cargo install cargo-fuzz --locked

      # ★★★ corpus ต้องอยู่ข้ามรอบ — ก่อน 21 ก.ย. 2026 มันไม่เคยอยู่เลย
      #
      #   `fuzz/corpus/` อยู่ใน `.gitignore` · ไม่มี `actions/cache` ตัวไหนเก็บมัน ·
      #   `Swatinem/rust-cache` เก็บแค่ registry กับ target dir · runner ถูกทิ้งทุกรอบ
      #   → ทุกรอบเริ่มจาก `fuzz/seeds/` เท่าที่มี **แล้วทิ้งสิ่งที่งอกทั้งหมด**
      #
      #   และคอมเมนต์หัวไฟล์เดิมเขียนว่า "corpus ยังถูกเก็บต่อเนื่อง" ซึ่ง**ไม่จริง**
      #   · มันเคยถูกใช้เป็นเหตุผลตอนลดความถี่ — `docs/08 §3.9` ข้อ 1:
      #   **การตัดสินใจที่ตั้งบนข้อความที่ไม่จริง ต้องถูกตัดสินใหม่**
      #
      # ★ คีย์ไม่ซ้ำต่อรอบ + `restore-keys` เป็นคำนำหน้า = cache แบบกลิ้ง:
      #   รอบนี้คืนของรอบล่าสุดที่มี แล้วเซฟของตัวเองเป็นกองใหม่
      #   (คีย์เดิมซ้ำ ๆ จะเซฟแค่ครั้งแรกครั้งเดียวแล้วแช่แข็งตลอดไป)
      #
      # ★★ แยก restore กับ save เป็นสองขั้น ไม่ใช้ `actions/cache` ตัวรวม
      #    ตัวรวมเซฟตอนจบ job **เฉพาะเมื่อ job เขียว** · รอบที่ fuzzer เจอ crash
      #    คือรอบที่ job แดง → corpus ที่งอกมาทั้งรอบถูกทิ้ง ทั้งที่มันคือรอบที่
      #    ไปได้ลึกที่สุด · ดูขั้น "เซฟ corpus ให้รอบหน้า" ข้างล่าง
      - name: คืน corpus ของรอบก่อน
        id: corpus
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # ★★ NC ของ cache เอง: ลบ cache ของ target หนึ่งทิ้ง แล้วรอบถัดไป
      #    **ต้องพิมพ์ว่าเริ่มจากศูนย์** ไม่ใช่เงียบแล้วดูเหมือนปกติ
      #    · กลไกที่ไม่มีใครรู้ว่ามันทำงานไหม คือกลไกที่เราเพิ่งเสียไปกับ fuzz ทั้งตัว
      #
      # ★★★ ขั้นนี้ **พังในรอบแรกที่มันถูกใช้จริง** (run 35564526229, 21 ก.ย. 2026
      #   · เจอ 24 ก.ย.)
      #   และพังตรงทางที่มันเกิดมาเพื่อรายงาน: cache ไม่เจอ → โฟลเดอร์ยังไม่มี
      #   → `ls` คืน 2 → `pipefail` ส่งต่อ → `bash -e` ของ Actions ฆ่าขั้นทิ้ง
      #   · `2>/dev/null` กลืนข้อความ "No such file or directory" ไป **ล็อกจึงมีแค่
      #   `exit code 2` ไม่มีคำอธิบายสักคำ** · fuzzer ไม่ได้รันเลยทั้งสี่ target
      #   → นับไฟล์ด้วย `count_files` ที่ **ถามก่อนว่าโฟลเดอร์มีไหม** และไม่มี
      #     `2>/dev/null` ที่ไหนในไฟล์นี้อีก (CLAUDE.md "ห้ามอ่าน exit code ผ่าน pipe")
      - name: cache คืนมาได้ไหม
        run: |
          set -uo pipefail
          count_files() { if [ -d "$1" ]; then find "$1" -maxdepth 1 -type f | wc -l; else echo 0; fi; }
          t=${{ matrix.target }}
          matched='${{ steps.corpus.outputs.cache-matched-key }}'
          if [ -z "$matched" ]; then
            echo "::notice title=$t เริ่มจากศูนย์::ไม่มี cache ของรอบก่อน — รอบนี้มีแต่ seed ที่ commit ไว้ · สาเหตุที่เป็นไปได้: target ใหม่ · cache ถูกลบ · ไม่ถูกแตะเกิน 7 วัน · ถูกไล่ออกเพราะ cache ของ repo เต็ม 10 GB"
          else
            echo "::notice title=$t คืน corpus ได้::$(count_files "fuzz/corpus/$t") ไฟล์ จาก '$matched' ($(du -sh "fuzz/corpus/$t" | cut -f1))"
          fi

      # corpus ตั้งต้นถูก commit ไว้ที่ fuzz/seeds/ ส่วน fuzz/corpus/ อยู่ใน .gitignore
      # (ของที่ fuzzer งอกเองมีเป็นพันไฟล์ ไม่ควรอยู่ใน repo)
      - name: วาง seed ทับลงไป
        run: |
          set -uo pipefail
          t=${{ matrix.target }}
          mkdir -p "fuzz/corpus/$t"
          # ★★★ seed ที่หายไป = **แดง** ไม่ใช่ warning และไม่ใช่ `|| true`
          #
          #   เดิมบรรทัดนี้จบด้วย `|| true` · `fuzz_layout` กับ `fuzz_document`
          #   จึงยิง 900 วินาทีจากศูนย์ทุกรอบ **โดยไม่มีอะไรบอกเลย** นานเท่าที่
          #   ไม่มีใครไปเปิดดู · `docs/08 §3.9` ข้อ 2: โครงเปล่าต้องไม่เงียบ
          #
          #   ประตูฝั่งเครื่องอยู่ที่ `seeds::tests::every_wired_target_has_a_seed_folder_with_files_in_it`
          #   ซึ่งแดงก่อนถึง CI — ตรงนี้คือด่านสุดท้ายเผื่อมีใครมาถึงได้
          count_files() { if [ -d "$1" ]; then find "$1" -maxdepth 1 -type f | wc -l; else echo 0; fi; }
          seeds=$(count_files "fuzz/seeds/$t")
          if [ "$seeds" -eq 0 ]; then
            echo "::error title=$t ไม่มี seed::fuzz/seeds/$t ว่างหรือไม่มี — target นี้จะยิงจากศูนย์ทุกรอบ · เพิ่มตัวสร้างใน xtask/src/seeds.rs แล้วรัน 'cargo xtask gen-fuzz-seeds'"
            exit 1
          fi
          restored=$(count_files "fuzz/corpus/$t")
          cp -n "fuzz/seeds/$t"/* "fuzz/corpus/$t/"
          before=$(count_files "fuzz/corpus/$t")
          echo "::notice title=$t corpus ก่อนยิง::$before ไฟล์ = คืนจาก cache $restored + seed ใหม่ $((before - restored)) (seed ทั้งหมด $seeds ใบ)"
          echo "CORPUS_BEFORE=$before" >> "$GITHUB_ENV"

      - name: fuzz ${{ matrix.target }}
        id: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=900

      # ★ corpus งอกเท่าไรในรอบนี้ — ตัวเลขที่ตอบว่า "ยังหาทางใหม่เจออยู่ไหม"
      #
      #   งอกน้อยลงเรื่อย ๆ = fuzzer ตันแล้ว การยิงนานขึ้น/ถี่ขึ้นไม่ช่วย
      #   งอกเยอะทุกรอบ = ยังมีพื้นที่ที่ไม่เคยถูกแตะ
      #   → พิมพ์เสมอ ทั้งตอนผ่านและไม่ผ่าน ด้วยเหตุผลเดียวกับ last-run-status.sh
      #
      # ★★ นี่คือตัวเลขที่เรื่อง "ความถี่ควรเป็นเท่าไร" ต้องตั้งอยู่บน · ก่อนมี
      #    ขั้นนี้ เราเถียงกันเรื่องความถี่ของสิ่งที่ไม่มีใครวัดว่ามันคืบไปแค่ไหน
      - name: corpus งอกเท่าไร
        if: always() && steps.fuzz.outcome != 'skipped'
        run: |
          set -uo pipefail
          count_files() { if [ -d "$1" ]; then find "$1" -maxdepth 1 -type f | wc -l; else echo 0; fi; }
          t=${{ matrix.target }}
          after=$(count_files "fuzz/corpus/$t")
          before=${CORPUS_BEFORE:-0}
          echo "::notice title=$t corpus::$before → $after ไฟล์ (+$((after - before))) ในรอบนี้ · $(du -sh "fuzz/corpus/$t" | cut -f1)"

      # ★★ เซฟ **แม้ job จะแดง** — ดูเหตุผลที่ขั้น "คืน corpus ของรอบก่อน"
      #
      #   เงื่อนไขคือ fuzzer **ได้รันจริง** (ไม่ถูกข้าม) · ถ้าขั้นก่อนหน้าพังจน
      #   fuzzer ไม่ได้เริ่ม ไม่มีอะไรใหม่ให้เซฟ และการเซฟจะสร้าง cache ใหม่ที่
      #   ไปแย่งที่ในเพดาน 10 GB โดยไม่มีประโยชน์
      #   · libFuzzer **เพิ่ม**ไฟล์ลง corpus เท่านั้น ไม่ลบ (เราไม่ได้สั่ง `-merge`)
      #     กองที่เซฟจึงไม่มีวันเล็กกว่ากองที่คืนมา
      - name: เซฟ corpus ให้รอบหน้า
        if: always() && steps.fuzz.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # input ที่ทำให้ล้มคือหลักฐานชิ้นเดียวที่เราจะได้ — ห้ามปล่อยหายไปกับ runner
      #
      # ★★ ขั้นนี้ไม่เคยทำงานเลยสักครั้ง (ดู job `fuzz-nc`) · จึงต้องมีขั้นก่อนหน้า
      #    ที่ **พิมพ์ว่ามีหลักฐานหรือไม่มี** — `if-no-files-found: ignore`
      #    ทำให้ "อัปโหลดไฟล์ศูนย์ไฟล์" กับ "อัปโหลดหลักฐานสำเร็จ" หน้าตาเหมือนกัน
      - name: มีหลักฐานให้เก็บไหม
        if: failure()
        run: |
          set -uo pipefail
          # ★ ถามก่อนว่ามีโฟลเดอร์ไหม — fuzzer ที่ไม่ได้เริ่มก็ไม่ได้สร้างมัน
          #   และ `find` บนโฟลเดอร์ที่ไม่มี + `pipefail` + `bash -e` คือสิ่งที่ฆ่า
          #   ขั้น "cache คืนมาได้ไหม" ในรอบ 35564526229
          n=0
          if [ -d fuzz/artifacts ]; then
            n=$(find fuzz/artifacts -type f | wc -l)
            find fuzz/artifacts -type f | sed 's/^/  /'
          fi
          if [ "$n" -eq 0 ]; then
            echo "::warning title=แดงแต่ไม่มีไฟล์หลักฐาน::${{ matrix.target }} ล้มโดยไม่มีไฟล์ใน fuzz/artifacts/ — แปลว่าล้มก่อนถึง fuzzer (build/toolchain) ไม่ใช่เจอ input ที่ทำให้พัง"
          else
            echo "::notice title=มีหลักฐาน $n ไฟล์::กำลังอัปโหลดเป็น fuzz-artifacts-${{ matrix.target }}"
          fi

      - name: เก็บ input ที่ทำให้ล้ม
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # ★★★ negative control — **พิสูจน์ว่า fuzz แดงเป็น ไม่ใช่ว่ามันเขียวอยู่**
  #
  # 21 ก.ย. 2026: ไล่ดู 20 รอบล่าสุด แดง 4 รอบ และทั้งสี่รอบ `fuzz-lint` กับ
  # `unwired-targets` แดงด้วย — สอง job ที่ไม่ได้ยิง fuzzer เลย · แปลว่าเส้นทาง
  # **"เจอ crash → job แดง → เก็บ artifact" ไม่เคยถูกเดินจริงสักครั้ง**
  #
  # I-4 ทั้งข้อพึ่งเครื่องมือที่ไม่มีใครเคยเห็นมันทำงานตอนเจอของ · เกณฑ์
  # "ไม่เจอ crash" วัดสองอย่างพร้อมกันโดยแยกไม่ออก: **"ไม่มีบั๊ก"** กับ
  # **"มีบั๊กแต่เราไม่เห็น"** — **ความเงียบยาวนานไม่ใช่หลักฐานของสุขภาพ**
  #
  # job นี้ปลูกความผิดพลาดลงใน target จริงทีละตัว แล้วบังคับให้ได้ทั้งสองอย่าง:
  # exit ไม่ใช่ศูนย์ **และ** ไฟล์หลักฐานที่ชื่อถูกกลไก · ครบสี่ target × สามชนิด
  #
  # ★ ทำไมต้องอยู่บน Linux: panic บน Windows ออกทาง `__fastfail` ซึ่งฆ่าโปรเซส
  #   ก่อน libFuzzer ได้เขียนไฟล์ — ครึ่งหลังจึงวัดบนเครื่องพัฒนาไม่ได้เลย
  #   (วัดจริงแล้ว 4/4 target) · **ที่นี่คือที่เดียวที่การพิสูจน์นับได้**
  #
  # ★ เดินครบสายแล้วที่ run 35561404557 — 12/12 เคสได้ไฟล์ชื่อตรงกลไก และขา
  #   `fuzz` ทั้งสี่แดงพร้อมอัปโหลด `crash-*` ที่ดาวน์โหลดได้จริง (`docs/08 §3.9` ข้อ 1)
  fuzz-nc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: ยืนยันว่าใช้ nightly จริง
        run: |
          rustc --version
          if ! rustc --version | grep -q nightly; then
            echo "::error::job นี้ไม่ได้รันบน nightly — rust-toolchain.toml ชนะอีกแล้ว"
            exit 1
          fi
      - run: cargo install cargo-fuzz --locked
      - name: ปลูกความผิดพลาดแล้วบังคับให้ fuzz แดง
        run: bash scripts/fuzz-nc.sh
      # ★ ไฟล์ที่ NC ทำให้เกิดคือหลักฐานว่าครึ่งหลังทำงาน — เก็บไว้ให้ดาวน์โหลดได้
      #   ไม่ใช่เชื่อบรรทัด "ผ่าน" ในล็อก
      - name: เก็บหลักฐานที่ NC ทำให้เกิด
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-nc-artifacts
          path: fuzz/artifacts/
          if-no-files-found: error

  # ★ กันไม่ให้เรื่องเดิมเกิดซ้ำ
  #
  # target ที่ยังไม่ได้ต่อถูกถอด `[[bin]]` ออกจาก fuzz/Cargo.toml ไปแล้ว
  # จึงไม่มีทาง "รันแล้วเขียวแบบว่างเปล่า" ได้อีก แต่ยังเหลือกับดักอีกข้อ:
  # วันที่ใครสัก implement `refx_io::dto` เสร็จแล้ว **ลืม** กลับมาต่อ fuzz target
  # job นี้จะล้มในคืนนั้นทันที พร้อมบอกว่าต้องแก้ตรงไหนบ้าง
  unwired-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ★★★ **ตรวจสภาพจริงของทั้งสองฝั่ง ไม่ใช่สมมติว่าฝั่งไหนเป็นยังไง**
      #
      #   รุ่นแรกเขียนไว้ว่า "target สองตัวนี้ยังไม่ต่อ — ล้มถ้า module มีโค้ด"
      #   ซึ่งถูกตอนที่เขียน แต่พอ P4-1 ต่อ `fuzz_document` **ครบทั้งสามจุดแล้ว**
      #   มันยังล้มอยู่ดี เพราะมันไม่เคยถามว่า "ต่อหรือยัง" มันจำมาว่า "ยังไม่ต่อ"
      #   → ประตูที่ต้องมีคนมาแก้ตามทุกครั้งคือประตูที่จะค้างสักวัน
      #
      #   รุ่นนี้ **อ่านสภาพจากไฟล์จริงทั้งสองฝั่ง** แล้วบังคับความสัมพันธ์:
      #     module มีโค้ด  <=>  target ถูกต่อครบสามจุด
      #   จึงจับได้ทั้งสองทิศ และไม่มีรายชื่อที่ต้องมาอัปเดตด้วยมืออีก
      - name: โค้ดที่ยิงได้กับ target ที่ต่อไว้ ต้องตรงกันเสมอ
        run: |
          set -uo pipefail
          status=0
          check() {
            target="$1"; module="$2"

            # ฝั่ง (ก) มีโค้ดให้ยิงหรือยัง — ไฟล์ TODO บรรทัดเดียว = ยังไม่มี
            #
            # ★ นับด้วย `awk 'NF'` ไม่ใช่ `grep -c … || true` · `grep -c` คืน 1
            #   เมื่อนับได้ศูนย์ จึงต้องมี `|| true` ห้อยท้าย ซึ่ง **กลบ exit 2 ของ
            #   ไฟล์ที่ไม่มีอยู่ไปด้วย** — module หายไปทั้งไฟล์ต้องแดงเสียงดัง
            #   ไม่ใช่ถูกนับเป็น "ศูนย์บรรทัด" แล้วไหลต่อ
            lines=$(awk 'NF' "$module" | wc -l)
            has_code=0
            [ "${lines:-0}" -gt 2 ] && has_code=1

            # ฝั่ง (ข) ต่อครบสามจุดหรือยัง (ไฟล์ target + [[bin]] + matrix)
            wired=1
            [ -f "fuzz/fuzz_targets/$target.rs" ] || wired=0
            grep -q "name = \"$target\"" fuzz/Cargo.toml || wired=0
            grep -q "$target" .github/workflows/fuzz.yml || wired=0
            # target ที่มีแต่ไฟล์ว่าง ๆ ไม่นับว่าต่อ · ไฟล์ที่ไม่มีเลยถูกจับที่บรรทัด
            # `[ -f … ]` ข้างบนแล้ว จึงถามก่อนนับ แทนที่จะนับแล้วกลืน error
            tlines=0
            if [ -f "fuzz/fuzz_targets/$target.rs" ]; then
              tlines=$(awk 'NF' "fuzz/fuzz_targets/$target.rs" | wc -l)
            fi
            [ "$tlines" -gt 12 ] || wired=0

            if [ "$has_code" = "1" ] && [ "$wired" = "1" ]; then
              echo "::notice::$target ต่อแล้วและ $module มีโค้ด ($lines บรรทัด) — ตรงกัน"
            elif [ "$has_code" = "0" ] && [ "$wired" = "0" ]; then
              echo "::notice::ข้าม $target — $module ยังไม่มีโค้ด ($lines บรรทัด) และ target ยังไม่ถูกต่อ"
            elif [ "$has_code" = "1" ]; then
              echo "::error::$module มีโค้ดแล้ว ($lines บรรทัด) แต่ $target ยังไม่ถูกต่อ"
              echo "::error::ต้อง (1) ต่อ fuzz/fuzz_targets/$target.rs (2) ลงทะเบียน [[bin]] ใน fuzz/Cargo.toml (3) ใส่ $target ใน matrix ของไฟล์นี้"
              status=1
            else
              # ★ ทิศกลับ: ต่อ target ไว้แต่ไม่มีโค้ดให้ยิง = fuzz ที่เขียวโดยไม่ตรวจอะไร
              #   ซึ่งเป็นบั๊กเดิมของ fuzz_decode ที่ job นี้เกิดมาเพื่อกัน
              echo "::error::$target ถูกต่อไว้แล้ว แต่ $module ยังไม่มีโค้ด ($lines บรรทัด) — fuzz จะเขียวโดยไม่ได้ยิงอะไร"
              status=1
            fi
          }
          check fuzz_document crates/refx-io/src/dto.rs
          # ★ `fuzz_journal` ถูกถอดทิ้งแล้ว (P4-9) — `refx_io::journal` จะไม่มี
          #   วันถูกเขียน เพราะ P4-3 เปลี่ยนไปใช้ snapshot (`docs/07 §4`)
          #   ประตูที่เฝ้าโมดูลซึ่งจะไม่มีวันเกิด คือประตูที่ไม่มีวันได้ทำงาน
          #   → ย้ายมาเฝ้า `packed` แทน ซึ่งเป็น parser ที่มีของจริงให้ยิง
          check fuzz_packed   crates/refx-io/src/packed.rs
          exit $status

  # `fuzz/` อยู่ใน `exclude` ของ workspace → `cargo clippy --all-targets` ของ CI หลัก
  # **มองไม่เห็นโค้ดในนั้นเลย** นี่คือเหตุผลที่ stub รอดมาได้ 5 session โดยไม่มีใครทัก
  fuzz-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2

      # ★ negative control ของตัวเอง: ถ้า toolchain หลุดกลับไป stable อีกครั้ง
      #   job นี้ต้องแดงทันที ไม่ใช่ผ่านแบบเงียบ ๆ แล้วบอกว่า "ตรวจ nightly แล้ว"
      - name: ยืนยันว่าใช้ nightly จริง
        run: |
          rustc --version
          if ! rustc --version | grep -q nightly; then
            echo "::error::job นี้ไม่ได้รันบน nightly — rust-toolchain.toml ชนะอีกแล้ว"
            exit 1
          fi
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
