# ★ เทสต์ที่ค้างต้องกลายเป็น "แดง" ไม่ใช่ "ซอมบี้"
#
# ไม่มีตัวนี้ เทสต์ที่ค้าง (เช่นรอ OS ที่ไม่มีวันตอบบน CI runner) จะรันไปจนชน
# เพดาน 6 ชั่วโมงของ GitHub Actions แล้วรายงานแค่ว่า "ยกเลิก" โดยไม่บอกว่า
# **ตัวไหน** ค้าง — เสียเวลา runner ทั้งก้อนแล้วยังไม่ได้ข้อมูลอะไรกลับมา
#
# period      = เตือนใน log ว่าเทสต์ตัวนี้ช้าผิดปกติ (ยังไม่ฆ่า)
# terminate-after = ครบ 4 รอบ (4 นาที) ให้ฆ่าแล้วรายงานเป็น TIMEOUT พร้อมชื่อเทสต์
#
# 4 นาทีเผื่อไว้เยอะแล้ว: เทสต์ที่ช้าที่สุดในโปรเจกต์คือ `idle_produces_no_redraw`
# (5 วินาที ตามนิยาม) และเทสต์ GPU บน software adapter ของ CI (< 1 วินาที)
[profile.default]
slow-timeout = { period = "60s", terminate-after = 4 }

# ★★★ เทสต์ที่วัด **ทั้งโปรเซส** ต้องรันลำพัง — `docs/08 §3.9` ข้อ 16
#
# `what_an_export_really_costs_in_process_memory` วัด RSS ของโปรเซสตัวเอง
# (จอง 64 MB แล้วแตะทุกหน้า เพื่อยืนยันว่ามาตรวัดยังใช้ได้ ก่อนจะวัด export จริง)
# · ล้ม **1 ใน 4 รอบ** ของการรันเต็มชุด และล้มที่ **0.6 วินาที** ขณะที่รอบที่ผ่าน
# ใช้ 18.9 วินาที = ล้มตั้งแต่ **ขั้นมาตรวัด** ไม่ใช่ตอนวัด export
#
# ★★ เกณฑ์ไม่ได้ผิด **สภาพแวดล้อมต่างหากที่ไม่ถูกควบคุม** — ห้ามผ่อนเกณฑ์ให้เขียว
#
# ข้อ 16 เขียนว่า "เทสต์ที่วัดทรัพยากรต้องมี binary ของตัวเอง" ซึ่งทำแล้ว —
# **แต่ binary ของตัวเองยังไม่ใช่รันลำพัง**: nextest รันหลาย binary ขนานกัน
# แล้วโปรเซสอื่นที่จองหน่วยความจำพร้อมกันทำให้ OS ตัด working set ของเรา
[test-groups]
# กลุ่มของเทสต์ที่วัดทั้งโปรเซส — ห้ามรันพร้อมกันเอง (เผื่อมีตัวที่สองในอนาคต)
memory-measurement = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(what_an_export_really_costs_in_process_memory)'
test-group = 'memory-measurement'
# ★★★ กลุ่มอย่างเดียว **ไม่พอ** — `max-threads` จำกัดเฉพาะสมาชิกในกลุ่มเดียวกัน
#   เทสต์อีกพันกว่าตัวนอกกลุ่มยังรันขนานอยู่ดี · `threads-required` ต่างหาก
#   ที่ทำให้มันจองช่องทั้งหมดแล้ว **รันลำพังจริง**
threads-required = 'num-test-threads'

# ★★★ negative control ของการแยกตัวนี้ — `docs/08 §3.9` ข้อ 1
#
#   โปรไฟล์นี้ **ไม่มี override** จึงปล่อยให้เทสต์วัดหน่วยความจำรันขนานกับตัวอื่น
#   เหมือนก่อนแก้ · ใช้พิสูจน์ว่าการแยกมีผลจริง ไม่ใช่ความบังเอิญ:
#
#     cargo nextest run --workspace --all-features --profile flake-nc
#
#   วัดจริง 14 ก.ย. 2026 (รันเต็มชุดโปรไฟล์ละ 8 รอบ) — ดู HANDOFF §2.53
#   ★ ถ้าวันหนึ่งโปรไฟล์นี้ไม่ flake อีกเลย **ให้สงสัยว่าอาการย้ายที่ ไม่ใช่ว่าหาย**
[profile.flake-nc]
slow-timeout = { period = "60s", terminate-after = 4 }
