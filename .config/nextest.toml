# ★ เทสต์ที่ค้างต้องกลายเป็น "แดง" ไม่ใช่ "ซอมบี้"
#
# ไม่มีตัวนี้ เทสต์ที่ค้าง (เช่นรอ OS ที่ไม่มีวันตอบบน CI runner) จะรันไปจนชน
# เพดาน 6 ชั่วโมงของ GitHub Actions แล้วรายงานแค่ว่า "ยกเลิก" โดยไม่บอกว่า
# **ตัวไหน** ค้าง — เสียเวลา runner ทั้งก้อนแล้วยังไม่ได้ข้อมูลอะไรกลับมา
#
# period      = เตือนใน log ว่าเทสต์ตัวนี้ช้าผิดปกติ (ยังไม่ฆ่า)
# terminate-after = ครบ 4 รอบ (4 นาที) ให้ฆ่าแล้วรายงานเป็น TIMEOUT พร้อมชื่อเทสต์
#
# ★★★ **คำอธิบายเดิมตรงนี้ผิดไปแล้ว — เก็บไว้เป็นบทเรียน ไม่ใช่ลบทิ้ง**
#
# เดิมเขียนว่า "4 นาทีเผื่อไว้เยอะแล้ว: เทสต์ที่ช้าที่สุดในโปรเจกต์คือ
# `idle_produces_no_redraw` (5 วินาที)" — **จริงตอนเขียน** แต่ `export_memory`
# ที่เพิ่มเข้ามาทีหลังใช้เวลาเกิน 240 วินาทีบน Windows runner (~50 เท่าของ
# ตัวที่คอมเมนต์นี้อ้างว่าช้าที่สุด) แล้ว Windows ก็แดงเงียบ ๆ อยู่สองรอบ
#
# ★ ค่าคงที่ที่มีเหตุผลกำกับ จะกลายเป็นค่าที่ **ไม่มีใครตรวจสอบเหตุผลซ้ำ**
#   เมื่อโลกรอบตัวมันเปลี่ยน · เพดานนี้ยังใช้กับเทสต์ทั่วไปที่เร็วทั้งหมด
#   ส่วนตัวที่ช้าจริงมี override ของตัวเองข้างล่างพร้อมตัวเลขที่วัดมา
[profile.default]
slow-timeout = { period = "60s", terminate-after = 4 }

# ★★★ เทสต์ที่วัด **ทั้งโปรเซส** ต้องรันลำพัง — `docs/08 §3.9` ข้อ 16
#
# `what_an_export_really_costs_in_process_memory` วัด RSS ของโปรเซสตัวเอง
# (จอง 64 MB แล้วแตะทุกหน้า เพื่อยืนยันว่ามาตรวัดยังใช้ได้ ก่อนจะวัด export จริง)
# · ล้ม **1 ใน 4 รอบ** ของการรันเต็มชุด และล้มที่ **0.6 วินาที** ขณะที่รอบที่ผ่าน
# ใช้ 18.9 วินาที = ล้มตั้งแต่ **ขั้นมาตรวัด** ไม่ใช่ตอนวัด export
#
# ★★ เกณฑ์ไม่ได้ผิด **สภาพแวดล้อมต่างหากที่ไม่ถูกควบคุม** — ห้ามผ่อนเกณฑ์ให้เขียว
#
# ข้อ 16 เขียนว่า "เทสต์ที่วัดทรัพยากรต้องมี binary ของตัวเอง" ซึ่งทำแล้ว —
# **แต่ binary ของตัวเองยังไม่ใช่รันลำพัง**: nextest รันหลาย binary ขนานกัน
# แล้วโปรเซสอื่นที่จองหน่วยความจำพร้อมกันทำให้ OS ตัด working set ของเรา
[test-groups]
# กลุ่มของเทสต์ที่วัดทั้งโปรเซส — ห้ามรันพร้อมกันเอง (เผื่อมีตัวที่สองในอนาคต)
memory-measurement = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(what_an_export_really_costs_in_process_memory)'
test-group = 'memory-measurement'
# ★★★ กลุ่มอย่างเดียว **ไม่พอ** — `max-threads` จำกัดเฉพาะสมาชิกในกลุ่มเดียวกัน
#   เทสต์อีกพันกว่าตัวนอกกลุ่มยังรันขนานอยู่ดี · `threads-required` ต่างหาก
#   ที่ทำให้มันจองช่องทั้งหมดแล้ว **รันลำพังจริง**
#
# ★★ ยืนยันบน runner จริงแล้ว 15 ก.ย. 2026: ในช่วง 240 วินาทีที่เทสต์นี้รันอยู่
#    **ไม่มีเทสต์ตัวอื่นจบเลยสักตัว** — การแยกตัวทำงานจริง ไม่ใช่แค่ตั้งค่าไว้
threads-required = 'num-test-threads'

# ★★★ **ไม่มี `slow-timeout` ของตัวเองที่นี่ — และนั่นคือผลของการวัด ไม่ใช่การละเลย**
#
#   เคยยกเป็น 10 นาทีชั่วคราวเพื่อ **วัดตัวเลขจริง** แล้วมัน **ทะลุ 10 นาที
#   ไปอีก** (`TIMEOUT [600.392s]` · run 34876124339) · การยกต่อไปเรื่อย ๆ คือ
#   การเปลี่ยนตัวจับเทสต์ค้างให้เป็นของประดับ จึงรัดกลับมาใช้เพดานรวม 4 นาที
#
#   ## เวลาของเทสต์นี้คือเวลาของ **rasterizer** ไม่ใช่ของโค้ดเรา
#
#   มันเรนเดอร์ tile บน GPU แล้วอ่านกลับ · วัดจริง 15 ก.ย. 2026:
#
#     เครื่องพัฒนา   RTX 4060 (GPU จริง)                        19 วิ
#     เครื่องพัฒนา   ผูก 2 คอร์ (GPU เดิม)                       27 วิ  ← คอร์ไม่ใช่สาเหตุ
#     ubuntu runner llvmpipe 256-bit (ซอฟต์แวร์)              109 วิ
#     windows runner **WARP** `Microsoft Basic Render Driver`  > 600 วิ
#
#   รายขั้นบน WARP: PNG 16384² ใช้ 325 วิ ขณะที่ในเครื่องใช้ 3.7 วิ (88 เท่า)
#   · **ค่า RSS ที่เทสต์นี้มีไว้ตรวจผ่านหมดทุกขั้นบน WARP** (+12/+32/+30 MB
#   เท่ากับในเครื่อง) — ที่ล้มคือนาฬิกาอย่างเดียว
#
#   → `ci.yml` จึงตัดเทสต์ตัวนี้ออกจาก **ขา Windows ของ CI เท่านั้น** พร้อมพิมพ์
#     บอกใน log · **ไม่ได้ตัดออกจาก Windows** — เครื่องพัฒนาทุกเครื่องเป็น Windows
#     และรันมันทุกครั้งใน 19 วินาที · ตัวบังคับใน CI คือ ubuntu (`§3.9` ข้อ 12)

# ★★★ negative control ของการแยกตัวนี้ — `docs/08 §3.9` ข้อ 1
#
#   โปรไฟล์นี้ **ไม่มี override** จึงปล่อยให้เทสต์วัดหน่วยความจำรันขนานกับตัวอื่น
#   เหมือนก่อนแก้ · ใช้พิสูจน์ว่าการแยกมีผลจริง ไม่ใช่ความบังเอิญ:
#
#     cargo nextest run --workspace --all-features --profile flake-nc
#
#   วัดจริง 13 ก.ย. 2026 (รันเต็มชุดโปรไฟล์ละ 8 รอบ) — ดู HANDOFF §2.53
#   ★ ถ้าวันหนึ่งโปรไฟล์นี้ไม่ flake อีกเลย **ให้สงสัยว่าอาการย้ายที่ ไม่ใช่ว่าหาย**
[profile.flake-nc]
slow-timeout = { period = "60s", terminate-after = 4 }
