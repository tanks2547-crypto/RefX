<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="RefX">
  <!-- ================================================================
       RefX — ไอคอน placeholder (ของเจ้าของโปรเจกต์ · ต้นฉบับ ไม่ลอกใคร)
       รูปคือ "กองภาพ reference ที่เรียงซ้อนกัน" + สี่เหลี่ยมสีหนึ่งอัน
       ซึ่งคือภาพที่กำลังถูกเลือกอยู่
       ออกแบบให้อ่านออกที่ 16 px: รูปทรงใหญ่ 3 ชิ้น ไม่มีรายละเอียดเส้นบาง
       ================================================================ -->

  <!-- ฐาน: สี่เหลี่ยมมุมมน โทนเดียวกับธีมมืดของแอป (#2A2A2E) แต่สว่างขึ้นเล็กน้อย
       เพื่อให้ไอคอนไม่จมหายบน taskbar สีเข้ม -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#33343A"/>

  <!-- การ์ดใบหลังสุด — เอียงซ้าย -->
  <g transform="rotate(-11 128 136)">
    <rect x="52" y="72" width="152" height="120" rx="12" fill="#6E7480"/>
  </g>

  <!-- การ์ดใบกลาง — เอียงขวาเล็กน้อย -->
  <g transform="rotate(6 128 136)">
    <rect x="56" y="76" width="152" height="120" rx="12" fill="#A8AEBB"/>
  </g>

  <!-- การ์ดใบหน้า — ตรง คือใบที่กำลังดูอยู่ -->
  <rect x="58" y="82" width="140" height="112" rx="12" fill="#F2F4F8"/>

  <!-- ภายในการ์ดใบหน้า: ภูเขา + ดวงอาทิตย์ แบบเรียบที่สุด
       (รูปทรงสามัญ ไม่ใช่เครื่องหมายของใคร) -->
  <circle cx="88" cy="112" r="13" fill="#E8A33D"/>
  <path d="M70 178 L108 130 L136 166 L154 144 L186 178 Z" fill="#4A5060"/>

  <!-- แถบสีเล็ก ๆ มุมล่างขวา = swatch ที่นักวาดใช้เทียบค่าสี -->
  <rect x="150" y="186" width="48" height="16" rx="8" fill="#E8A33D"/>
</svg>
