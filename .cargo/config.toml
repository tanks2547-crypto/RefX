# ★★★ `+crt-static` — **"ติดตั้งแล้วเปิดไม่ขึ้น" คือบั๊กที่เราไม่มีวันเห็นเอง**
#
#   Rust MSVC target ลิงก์ VC++ runtime แบบ dynamic โดยปริยาย · ตรวจไบนารีของจริง
#   17 ก.ย. 2026 พบว่ามัน import **`VCRUNTIME140.dll`** ซึ่งมาจาก
#   "VC++ redistributable" **ไม่ใช่ของที่ Windows มีมาให้**
#   (`api-ms-win-crt-*` คือ UCRT ซึ่ง Windows 10+ มีอยู่แล้ว — คนละเรื่องกัน)
#
#   เครื่องนักพัฒนามี redist เสมอ เพราะลง Visual Studio ไปแล้ว · Windows
#   ที่เพิ่งลงใหม่อาจไม่มี → ผู้ใช้ติดตั้ง MSI สำเร็จ แล้ว **เปิดไม่ขึ้นเลย**
#   ด้วยกล่อง error ของ OS ก่อนโค้ดของเราได้รันแม้แต่บรรทัดเดียว
#   — dialog "RefX cannot start" ที่เราเพิ่งทำก็ช่วยไม่ได้ เพราะยังไม่ถึงตานั้น
#
#   ★ วัดแล้วก่อนรับเข้า (17 ก.ย. 2026):
#
#     dynamic CRT  17.48 MB  (69.9 % ของเพดาน)  ต้องมี VCRUNTIME140.dll
#     +crt-static  17.71 MB  (70.8 % ของเพดาน)  **ไม่พึ่ง CRT DLL ตัวไหนเลย**
#     ต่าง         +0.23 MB (+1.3 %)
#
#   portable zip **ต้องพึ่งตัวเองได้ตามนิยามของมัน** — 0.23 MB คือราคาที่ถูก
#   เมื่อเทียบกับคลาสของบั๊กที่มันปิดไปทั้งคลาส
#
# ★★★ กับดักที่ต้องตรวจก่อนรับเข้า และเคยกัดเรามาแล้ว (`docs/08 §3.9` ข้อ 13)
#
#   `[target.'cfg(...)']` **ไม่แยก host ออกจาก target** เมื่อไม่ได้ส่ง `--target`
#   → proc-macro ได้ธงนี้ไปด้วย ซึ่งคือกลไกเดียวกับที่ `-C relocation-model=pie`
#   ทำให้ Linux build พังทั้งทรี · จึงต้อง **รันชุดเทสต์ทั้งชุดก่อน ไม่ใช่เดาว่ารอด**
#   — ยืนยันแล้วว่าผ่าน ดู HANDOFF §2.59
[target.'cfg(target_os = "windows")']
rustflags = ["-C", "control-flow-guard=yes", "-C", "target-feature=+crt-static"]

# ★★★ ห้ามใส่ `-C relocation-model=pie` กลับเข้ามา — มันทำให้ **build บน Linux
#     พังทั้งทรี** และอาการไม่ได้ชี้มาทางนี้เลยแม้แต่น้อย
#
#   `[target.'cfg(...)']` **ไม่ได้แยก host ออกจาก target** เมื่อไม่ได้ส่ง
#   `--target` · proc-macro (ซึ่งเป็น dylib ของ host) จึงได้ธงนี้ไปด้วย แล้ว
#   rustc โหลดมันไม่ได้ · ผลที่เห็นคือ `zbus` ล้ม **157 error** ที่หน้าตาเหมือน
#   โค้ดของ zbus เสียเอง (`cannot find attribute zbus`,
#   `can't find crate for zbus_macros`, `the name Stats is defined multiple times`)
#   — ไม่มีบรรทัดไหนพูดถึง rustflags เลยสักบรรทัด
#
#   พิสูจน์แล้วด้วยการเปลี่ยนตัวแปรทีละตัว (probe run 34805070404, 34805412531):
#     เอา .cargo/config.toml ออก        → ผ่าน
#     เหลือแต่ relocation-model=pie      → **ล้ม**
#     เหลือแต่ link-arg relro,now        → ผ่าน
#     config เดิมครบ แต่ build ด้วย --target → ผ่าน (เพราะ --target แยก host ออก)
#
#   ★ และธงนี้ **ไม่ได้ให้อะไรเพิ่มอยู่แล้ว**: x86_64-unknown-linux-gnu ตั้ง
#     `relocation-model = pic` + `position-independent-executables = true`
#     เป็นค่าเริ่มต้นของ target อยู่ก่อนแล้ว · เราจ่ายด้วย build ที่พังทั้งทรี
#     เพื่อแลกกับศูนย์
#
#   ★★ ของที่ต้องการจริงคือ **คุณสมบัติของไฟล์ที่แจก ไม่ใช่ธงที่สั่ง** —
#     `cargo xtask verify-deb` ตรวจ PIE + BIND_NOW จากตัว binary ที่แตกออกมา
#     จาก `.deb` โดยตรง ธงหายเมื่อไหร่ประตูนั้นแดง ไม่ใช่เงียบ
#
#   13–14 ก.ย. 2026 · `docs/08 §3.9` ข้อ 13
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-z,relro,-z,now"]

[alias]
xtask = "run --package xtask --"
