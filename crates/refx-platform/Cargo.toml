[package]
name         = "refx-platform"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

# crate เดียวที่อนุญาต unsafe (ADR-007 / I-5) — ทุกบล็อกต้องมี // SAFETY:
#
# ห้ามใช้ `[lints] workspace = true` ที่นี่: workspace ตั้ง unsafe_code = "forbid"
# ซึ่ง cargo ไม่ยอมให้ override เป็น "allow" (forbid ลดระดับไม่ได้ตามนิยาม)
# จึงต้องคัดลอกชุด lint จาก [workspace.lints] มาไว้เองทั้งหมด
# ★ ถ้าแก้ [workspace.lints] ใน Cargo.toml ราก ต้องแก้ที่นี่ตามด้วย
[lints.rust]
unsafe_code  = "allow"
missing_docs = "warn"

[lints.clippy]
all                = { level = "warn", priority = -1 }
unwrap_used        = "warn"
expect_used        = "warn"
panic              = "warn"
disallowed_methods = "warn"
float_cmp          = "warn"
large_stack_arrays = "warn"

[dependencies]
# ★ refx-core เป็นชั้นล่างสุด (ไม่ depend crate ภายในตัวไหนเลย) การพึ่งมันจึงไม่เกิดวง
#   และไม่ผิดกฎ "ชั้นล่างห้ามรู้จักชั้นบน" — ARCHITECTURE §2 เขียนว่า refx-platform
#   เป็น leaf ซึ่งตอนนี้ไม่จริงแล้ว **ต้องอัปเดตเอกสาร** (ดูรายงาน HANDOFF §2.0)
#   เหตุผล: DTO/trait ของ clipboard ต้องอยู่ที่ที่ทั้ง refx-asset และที่นี่เรียกได้
refx-core.workspace = true
winit.workspace   = true
rfd.workspace     = true
arboard.workspace = true
directories.workspace = true
thiserror.workspace   = true
tracing.workspace     = true
