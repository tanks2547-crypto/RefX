[package]
name         = "refx-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
glam.workspace     = true
smallvec.workspace = true
indexmap.workspace = true   # Selection ต้องรู้ลำดับที่คลิก (docs/02 §4) — ใช้จริงใน selection.rs
thiserror.workspace = true
serde.workspace    = true
tracing.workspace  = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true   # P5-1 — `criterion` ประกาศไว้ตั้งแต่วันแรกโดยไม่มีใครเรียก

# ★ `harness = false` บังคับ: criterion มี `main` ของตัวเอง
#   `--output-format bencher` ของมันคือสิ่งที่ `scripts/check-bench.py` อ่าน
[[bench]]
name    = "core_benches"
harness = false
