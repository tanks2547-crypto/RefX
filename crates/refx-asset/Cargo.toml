[package]
name         = "refx-asset"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
# !! ห้ามใส่ refx-platform กลับมา (HANDOFF §2.0 — แยกชั้นแล้ว 2 ส.ค. 2026)
#    ชั้น asset ไม่ควรรู้จัก windowing / dialog / clipboard เลย (ARCHITECTURE §2)
#    ตอนที่ยังพึ่งอยู่ `fuzz/` ที่ต้องการแค่ decoder ต้องคอมไพล์ winit+rfd+arboard
#    ทั้งกองด้วย nightly แล้วล้มที่ zbus — เป็นการรั่วของชั้น ไม่ใช่ปัญหาของ fuzz
#    สิ่งที่เคยเอามาจากที่นั่นถูกกลับทิศแล้ว:
#      panic_guard → refx-core::panic_guard
#      clipboard   → refx-core::clipboard (trait) + refx-ui เสียบตัวจริงให้
#      total_ram   → ผู้เรียกส่งเข้ามาที่ DecodePool::with_defaults
refx-core.workspace     = true
image.workspace     = true
# ★ P5-4 Export — เขียน PNG **ทีละแถบ** (`image` ไม่มี API สตรีมสำหรับ PNG)
#   ดูเหตุผลเต็มและประตู `cargo tree -d | grep '^png'` ที่ Cargo.toml ราก + docs/09
png.workspace       = true
fast_image_resize.workspace = true
kamadak-exif.workspace = true
blake3.workspace    = true
rusqlite.workspace  = true
# !! ห้ามใส่ memmap2 กลับมาสำหรับไฟล์ของผู้ใช้ (ตัดสิน 27 ก.ค. 2026, docs/06 §3)
#    ไฟล์ที่ map ไว้ถูก Dropbox/OneDrive ตัดกลางคัน = SIGBUS ซึ่งเป็น signal ไม่ใช่ panic
#    catch_unwind จับไม่ได้ → เกราะ I-7 ไร้ผลทั้งชั้น โปรเซสตายทันที
crossbeam-channel.workspace = true
parking_lot.workspace = true
smallvec.workspace  = true
thiserror.workspace = true
tracing.workspace   = true
directories.workspace = true

[dev-dependencies]
# ★ **dev-dependency เท่านั้น** — ใช้คำนวณ CRC ของ `eXIf` chunk ใน fixture ของ
#   เทสต์ (PNG ที่มี EXIF จริง) · ตัวโปรแกรมไม่ได้ใช้ และ dev-dep ไม่ตามไปที่
#   `fuzz/` ซึ่งพึ่ง crate นี้แบบปกติ
#   ★★ ไม่เขียน CRC32 เอง: fixture ที่ checksum ผิดจะถูก decoder บางตัวปล่อยผ่าน
#      แล้วเทสต์จะวัดของที่ไม่ใช่ของจริงโดยไม่มีอะไรฟ้อง (`docs/08 §3.9` ข้อ 9)
crc32fast.workspace = true

