[package]
name         = "refx-ui"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
refx-core.workspace     = true
refx-asset.workspace    = true
refx-render.workspace   = true
refx-io.workspace       = true
refx-platform.workspace = true
egui.workspace       = true
egui-wgpu.workspace  = true
egui-winit.workspace = true
# ★ ชั้นนี้ไม่ได้เลือก backend — มันแค่ใช้ชนิดของ wgpu กับ shader WGSL
#   backend ถูกเลือกที่ `refx-render` ต่อ OS (ดูที่นั่น) แล้ว cargo union ให้เอง
wgpu = { workspace = true, features = ["std", "wgsl"] }
winit.workspace      = true
glam.workspace       = true
indexmap.workspace   = true
crossbeam-channel.workspace = true   # รับผลจาก decode pool / IO thread (ADR-004)
thiserror.workspace  = true
tracing.workspace    = true

[dev-dependencies]
criterion.workspace = true   # P5-1 — เพดาน `build_instances_1000` ของ docs/08 §2

# ★ `harness = false` บังคับ: criterion มี `main` ของตัวเอง
[[bench]]
name    = "instances"
harness = false

[features]
default = []
force-device-lost = ["refx-render/force-device-lost"]
profiling = []
