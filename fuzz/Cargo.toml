[package]
name    = "refx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
refx-asset = { path = "../crates/refx-asset" }
refx-core  = { path = "../crates/refx-core" }
refx-io    = { path = "../crates/refx-io" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc  = false

