[package]
name    = "refx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
refx-asset = { path = "../crates/refx-asset" }
refx-core  = { path = "../crates/refx-core" }
refx-io    = { path = "../crates/refx-io" }
# ต้องใช้ประกอบหัวไฟล์ที่ถูกต้องให้ fuzzer (ดูคอมเมนต์ใน fuzz_document.rs)
crc32fast  = "1"
zstd       = "0.13"

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_layout"
path = "fuzz_targets/fuzz_layout.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_document"
path = "fuzz_targets/fuzz_document.rs"
test = false
doc  = false

[[bin]]
name = "fuzz_packed"
path = "fuzz_targets/fuzz_packed.rs"
test = false
doc  = false

# ★ target ทั้งสี่ต่อกับโค้ดจริงครบแล้ว (P4-9)
#
# `fuzz_layout` ต่อตอน P3-2 · `fuzz_document` ตอน P4-1 ·
# **`fuzz_packed` มาแทน `fuzz_journal`** ตอน P4-9 — `refx_io::journal`
# จะไม่มีวันถูกเขียนเพราะ P4-3 เปลี่ยนไปใช้ snapshot แล้ว (`docs/07 §4`)
# ส่วน `packed` เป็น parser ไบนารีตัวเดียวที่เหลือซึ่งไม่เคยถูก fuzz เลย
#
# ★ เพิ่ม target ใหม่เมื่อไหร่ ต้องทำครบสามจุดพร้อมกัน:
#   (1) ไฟล์ target (2) `[[bin]]` ตรงนี้ (3) matrix ใน `.github/workflows/fuzz.yml`
#   job `unwired-targets` จะล้มถ้าขาดข้อใดข้อหนึ่ง — และล้มทั้งสองทิศ
#   (มีโค้ดแต่ไม่ได้ต่อ · ต่อแล้วแต่ไม่มีโค้ดให้ยิง)
